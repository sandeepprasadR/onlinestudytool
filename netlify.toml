# Netlify hosting: the static app is copied to dist/; netlify/functions/hw.mts stores homework in Netlify Blobs.
[build]
  command = "mkdir -p dist && cp -r index.html sw.js vendor manifest.webmanifest icon-*.png dist/"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  # web-push is CommonJS; ship it as a normal package instead of bundling it into the ESM function
  external_node_modules = ["web-push"]
