<!doctype html>
<html lang="en">
<head>

<title>Study Board</title>
<style>
/* Layout: one-screen app. A wrapping toolbar on top, a scrolling "desk" of paper pages below. */
:root {
  --ui-bg: #f4f6f9;
  --ui-panel: #ffffff;
  --ui-fg: #1c2430;
  --ui-muted: #5d6b7c;
  --ui-line: #d9dfe7;
  --accent: #2457d6;
  --accent-soft: #e3ebfc;
  --desk: #e4e8ee;
  --danger: #c2362b;
  --toast-bg: #1c2430;
  --toast-fg: #f4f6f9;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --board: #1f2f28;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ui-bg: #151a21; --ui-panel: #1d242d; --ui-fg: #e6ebf2; --ui-muted: #97a3b3; --ui-line: #2e3742;
    --accent: #7aa2ff; --accent-soft: #25324d; --desk: #0f1318; --danger: #ff6b5e;
    --toast-bg: #e6ebf2; --toast-fg: #151a21; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ui-bg: #151a21; --ui-panel: #1d242d; --ui-fg: #e6ebf2; --ui-muted: #97a3b3; --ui-line: #2e3742;
  --accent: #7aa2ff; --accent-soft: #25324d; --desk: #0f1318; --danger: #ff6b5e;
  --toast-bg: #e6ebf2; --toast-fg: #151a21; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--ui-bg); color: var(--ui-fg); font: 14px/1.4 var(--font-ui);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Toolbar */
#bar {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0;
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--ui-panel); border-bottom: 1px solid var(--ui-line);
  touch-action: manipulation; position: relative; z-index: 20;
}
.grp { display: flex; align-items: center; gap: 1px; padding: 0 5px; border-right: 1px solid var(--ui-line); min-height: 40px; }
.grp:first-child { padding-left: 0; }
.grp:last-child { border-right: 0; margin-left: auto; padding-right: 0; }
.ib {
  width: 38px; height: 40px; border: 0; border-radius: 10px; background: transparent;
  display: grid; place-items: center; padding: 0; position: relative;
}
.ib svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ib:hover { background: var(--accent-soft); }
.ib.on { background: var(--accent-soft); color: var(--accent); }
.ib:disabled { opacity: .35; cursor: default; background: transparent; }
.ib .caret { position: absolute; right: 3px; bottom: 3px; width: 0; height: 0; border-left: 4px solid transparent; border-top: 4px solid currentColor; transform: rotate(-45deg); opacity: .7; }
.tb { height: 40px; border: 0; border-radius: 10px; background: transparent; padding: 0 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tb:hover { background: var(--accent-soft); }
#nbName {
  width: 132px; height: 36px; border: 1px solid transparent; border-radius: 8px; background: transparent;
  color: var(--ui-fg); font: 600 16px var(--font-ui); padding: 0 8px; -webkit-user-select: text; user-select: text;
}
#nbName:hover, #nbName:focus { border-color: var(--ui-line); background: var(--ui-bg); outline: none; }
.sw {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ui-line); margin: 0 2px; padding: 0;
  background: var(--c); flex: none;
}
.sw.on { box-shadow: 0 0 0 2px var(--ui-panel), 0 0 0 4px var(--accent); }
.sw.custom { display: grid; place-items: center; background: conic-gradient(#e53935, #fdd835, #43a047, #1e88e5, #8e24aa, #e53935); position: relative; overflow: hidden; cursor: pointer; }
.sw.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
.sz span { display: block; border-radius: 50%; background: currentColor; }
.dim { opacity: .45; }
body.compact .x { display: none; }

/* Desk and pages */
#scroller {
  flex: 1; min-height: 0; overflow: auto; background: var(--desk);
  touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}
body.finger #scroller { touch-action: none; }
#pages { position: relative; padding: 16px 16px 40px; }
.page {
  position: relative; margin: 0 auto 28px; background-color: #fff;
  box-shadow: 0 1px 2px rgba(20,30,45,.18), 0 6px 18px rgba(20,30,45,.10);
  overflow: hidden; contain: layout paint;
}
.page::after {
  content: attr(data-n); position: absolute; right: 8px; bottom: 6px; font: 11px var(--font-ui);
  color: #8a96a6; pointer-events: none;
}
.page canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.page.pdf-error::before {
  content: "This PDF page could not be shown"; position: absolute; inset: 0; display: grid; place-items: center; color: #8a96a6;
}
/* Paper styles, scaled by --u (CSS px per page unit; a page is 1000 units wide) */
.bg-ruled {
  background-image:
    linear-gradient(to right, transparent calc(var(--u) * 90 - 1px), #f2a3a3 calc(var(--u) * 90 - 1px), #f2a3a3 calc(var(--u) * 90 + 1px), transparent calc(var(--u) * 90 + 1px)),
    linear-gradient(to bottom, transparent calc(100% - 1px), #b9d3ee calc(100% - 1px));
  background-size: 100% 100%, 100% calc(var(--u) * 36);
  background-position: 0 0, 0 calc(var(--u) * 12);
  background-repeat: no-repeat, repeat;
}
.bg-graph {
  background-image:
    linear-gradient(to right, #9fc0e0 1px, transparent 1px), linear-gradient(to bottom, #9fc0e0 1px, transparent 1px),
    linear-gradient(to right, #dbe7f3 1px, transparent 1px), linear-gradient(to bottom, #dbe7f3 1px, transparent 1px);
  background-size: calc(var(--u) * 125) calc(var(--u) * 125), calc(var(--u) * 125) calc(var(--u) * 125),
    calc(var(--u) * 25) calc(var(--u) * 25), calc(var(--u) * 25) calc(var(--u) * 25);
}
.bg-dot {
  background-image: radial-gradient(circle, #a9b4c2 calc(var(--u) * 1.8), transparent calc(var(--u) * 1.8 + .6px));
  background-size: calc(var(--u) * 30) calc(var(--u) * 30);
}
.page.bg-board { background-color: var(--board); }
.page.bg-board::after { color: #6f8a7d; }

/* Popover menus */
#pop {
  position: fixed; z-index: 50; min-width: 230px; max-width: min(340px, calc(100vw - 16px)); max-height: 72vh; overflow: auto;
  background: var(--ui-panel); color: var(--ui-fg); border: 1px solid var(--ui-line); border-radius: 14px;
  box-shadow: 0 12px 32px rgba(10,20,35,.22); padding: 6px; display: flex; flex-direction: column; gap: 2px;
}
.ph { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ui-muted); padding: 8px 10px 4px; }
.pi {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent;
  padding: 10px 12px; border-radius: 9px; min-height: 42px;
}
.pi:hover { background: var(--accent-soft); }
.pi.on { color: var(--accent); font-weight: 600; }
.pi.danger, .pi[data-armed] { color: var(--danger); }
.pi .sub { margin-left: auto; color: var(--ui-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.pi:disabled { opacity: .4; cursor: default; background: transparent; }
.pi svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.prev { width: 26px; height: 34px; border-radius: 3px; border: 1px solid var(--ui-line); flex: none; background-color: #fff; --u: .14px; }
.prev.bg-board { background-color: var(--board); }
.nbrow { display: flex; align-items: center; gap: 2px; }
.nbrow .pi { flex: 1; min-width: 0; }
.nbrow .pi span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nbrow .del { width: 40px; flex: none; justify-content: center; padding: 0; color: var(--ui-muted); }
.nbrow .del[data-armed] { width: auto; padding: 0 10px; color: var(--danger); }
.pgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 4px; }
.pgrid button { height: 40px; border: 1px solid var(--ui-line); border-radius: 8px; background: transparent; font-variant-numeric: tabular-nums; }
.pgrid button.on { background: var(--accent); border-color: var(--accent); color: var(--ui-panel); }
.help { padding: 6px 12px 10px; max-width: 320px; -webkit-user-select: text; user-select: text; }
.help p { margin: 6px 0; }
.help b { font-weight: 600; }
#pop.wide { min-width: min(400px, calc(100vw - 16px)); max-width: min(440px, calc(100vw - 16px)); }
.chn { width: 22px; flex: none; text-align: right; color: var(--ui-muted); font-variant-numeric: tabular-nums; }
.cht { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tick {
  width: 26px; height: 26px; flex: none; margin: 0 4px 0 6px; border-radius: 7px; border: 2px solid var(--ui-line);
  background: transparent; display: grid; place-items: center; padding: 0;
}
.tick.on { background: var(--accent); border-color: var(--accent); }
.tick.on::after { content: ""; width: 10px; height: 6px; border: solid var(--ui-panel); border-width: 0 0 2.5px 2.5px; transform: translate(0, -1px) rotate(-45deg); }
.filesel { max-width: 150px; height: 36px; border: 1px solid var(--ui-line); border-radius: 8px; background: var(--ui-panel); color: var(--ui-fg); font: inherit; padding: 0 6px; }

/* Toast */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 32px);
  background: var(--toast-bg); color: var(--toast-fg); padding: 10px 14px; border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
#toast button { border: 0; border-radius: 8px; padding: 8px 12px; background: var(--accent); color: #fff; font-weight: 600; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  #toast:not([hidden]) { animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
}
@media (max-width: 700px) {
  #nbName { width: 110px; }
  .grp { padding: 0 3px; }
}
</style>
</head>
<body>
<header id="bar" role="toolbar" aria-label="Writing tools">
  <div class="grp">
    <button class="ib" id="bBooks" title="Notebooks" aria-label="Notebooks"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <input id="nbName" class="x" aria-label="Notebook name" maxlength="60" autocomplete="off" spellcheck="false">
  </div>
  <div class="grp" id="gTools">
    <button class="ib tool" data-tool="pen" title="Pen (P)" aria-label="Pen"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L16.6 4a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14.5 6l3.5 3.5"/></svg></button>
    <button class="ib tool" data-tool="hl" title="Highlighter (H)" aria-label="Highlighter"><svg viewBox="0 0 24 24"><path d="M8.5 14.5l7.8-9.8a1.8 1.8 0 0 1 2.6-.2l1 .9a1.8 1.8 0 0 1 .1 2.6l-8.6 9z"/><path d="M8.5 14.5l2.9 2.5-1.6 1.7H6.2l-.7-.6z"/><path d="M3 21h9"/></svg></button>
    <button class="ib tool" data-tool="eraser" title="Eraser (E)" aria-label="Eraser"><svg viewBox="0 0 24 24"><path d="M8.5 20H20"/><path d="M4.4 14.6l9.2-9.2a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L11 20H8.8l-4.4-4.4a.7.7 0 0 1 0-1z"/><path d="M9 10l5 5"/></svg></button>
    <button class="ib tool" data-tool="laser" title="Laser pointer (L)" aria-label="Laser pointer"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg></button>
    <button class="ib tool" data-tool="shape" id="bShape" title="Shapes: tap again to choose" aria-label="Shapes"></button>
  </div>
  <div class="grp" id="gColors" aria-label="Colours"></div>
  <div class="grp" id="gSizes" aria-label="Thickness"></div>
  <div class="grp">
    <button class="ib" id="bUndo" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ib" id="bRedo" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  </div>
  <div class="grp x">
    <button class="ib" id="bAdd" title="Add or change page" aria-label="Add page"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M12 10.5v6M9 13.5h6"/></svg></button>
    <button class="ib" id="bPdf" title="Insert a PDF" aria-label="Insert PDF"><svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M12 10v7M9 14l3 3 3-3"/></svg></button>
  </div>
  <div class="grp x">
    <button class="tb" id="bPage" title="Go to page" aria-label="Go to page">1 / 1</button>
    <button class="tb" id="bFit" title="Fit page width" aria-label="Fit page width">Fit</button>
  </div>
  <div class="grp">
    <button class="ib" id="bMore" title="More" aria-label="More options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
  </div>
</header>
<main id="scroller"><div id="pages"></div></main>
<div id="pop" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const WORKER_SRC = 'vendor/pdf.worker.min.js';
const U = 1000;              // every page is 1000 units wide
const A4H = 1414;            // A4 portrait height in units
const BOARD = '#1f2f28';
const PEN = ['#1b1f24', '#1f4fd1', '#d32f2f', '#15803d', '#e8710a', '#7c3aed', '#ffffff'];
const PEN_NAMES = ['Black', 'Blue', 'Red', 'Green', 'Orange', 'Purple', 'White'];
const HL = ['#ffe24a', '#7dee8b', '#ff8fd6', '#80cbff', '#ffb34d'];
const HL_NAMES = ['Yellow', 'Green', 'Pink', 'Blue', 'Orange'];
const SIZES = { pen: [2, 3.5, 6], hl: [16, 26, 40], eraser: [10, 22, 45] };
const BG_TYPES = [['blank', 'Blank'], ['ruled', 'Ruled'], ['graph', 'Graph (squares)'], ['dot', 'Dotted'], ['board', 'Blackboard']];
// NCERT Class 10 (English medium) textbooks, current rationalised editions
const CATALOG = {
  maths: ['Real Numbers', 'Polynomials', 'Pair of Linear Equations in Two Variables', 'Quadratic Equations',
    'Arithmetic Progressions', 'Triangles', 'Coordinate Geometry', 'Introduction to Trigonometry',
    'Some Applications of Trigonometry', 'Circles', 'Areas Related to Circles', 'Surface Areas and Volumes',
    'Statistics', 'Probability'],
  science: ['Chemical Reactions and Equations', 'Acids, Bases and Salts', 'Metals and Non-metals', 'Carbon and its Compounds',
    'Life Processes', 'Control and Coordination', 'How do Organisms Reproduce', 'Heredity',
    'Light Reflection and Refraction', 'The Human Eye and the Colourful World', 'Electricity',
    'Magnetic Effects of Electric Current', 'Our Environment']
};
const SUBJECT_NAMES = { maths: 'Maths', science: 'Science' };
const SHAPES = [['line', 'Straight line'], ['arrow', 'Arrow'], ['rect', 'Rectangle'], ['ellipse', 'Circle or ellipse']];
const ICON = {
  line: '<svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg>',
  arrow: '<svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg>',
  rect: '<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>',
  ellipse: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="7"/></svg>',
  pdf: '<svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v8h14v-8"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13"/></svg>',
  clear: '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M9.5 11.5l5 5M14.5 11.5l-5 5"/></svg>',
  hand: '<svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4.5a1.5 1.5 0 0 1 3 0V11M14 10.5V6a1.5 1.5 0 0 1 3 0v8a7 7 0 0 1-7 7h-.5a6 6 0 0 1-5-2.7L3 15.5a1.6 1.6 0 0 1 2.6-1.8L8 16"/></svg>',
  compact: '<svg viewBox="0 0 24 24"><path d="M4 7h16M8 12h8M10 17h4"/></svg>',
  full: '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  book: '<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 7.5h8M8 11h5"/></svg>',
  help: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>'
};

/* ---------- small helpers ---------- */
const $ = (s) => document.querySelector(s);
const scroller = $('#scroller');
const pagesEl = $('#pages');
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}

/* ---------- preferences (per device) ---------- */
const prefs = Object.assign({
  tool: 'pen', shape: 'line', penColor: PEN[0], hlColor: HL[0],
  size: { pen: 1, hl: 1, eraser: 1 }, fingerDraw: false, compact: false, lastBg: 'graph', lastNb: null, seenTip: false
}, (() => { try { return JSON.parse(localStorage.getItem('studyboard-prefs') || '{}'); } catch (e) { return {}; } })());
function savePrefs() { try { localStorage.setItem('studyboard-prefs', JSON.stringify(prefs)); } catch (e) { /* storage blocked */ } }

/* ---------- storage: IndexedDB with an in-memory fallback ---------- */
const DB = {
  db: null, mem: null,
  open() {
    return new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open('studyboard', 1); } catch (e) { rej(e); return; }
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('notebooks')) d.createObjectStore('notebooks', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('pdfs')) d.createObjectStore('pdfs');
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('Storage is blocked'));
    });
  },
  useMemory() { this.mem = { notebooks: new Map(), pdfs: new Map() }; },
  run(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const rq = fn(t.objectStore(store));
      let out;
      if (rq) rq.onsuccess = () => { out = rq.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Storage full or blocked'));

    const mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2;
    zoomTo(pinch.s * tdist(a, b) / pinch.d, mx, my, false);

    scroller.scrollTop -= my - pinch.my;
    pinch.mx = mx; pinch.my = my;
  }
}, { passive: false });
function endTouch(e) { if (pinch && e.touches.length < 2) { pinch = null; scheduleRepaint(); } }
scroller.addEventListener('touchend', endTouch, { passive: true });
scroller.addEventListener('touchcancel', endTouch, { passive: true });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('gesturechange', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => { if (e.target.closest('#scroller')) e.preventDefault(); });

/* trackpad / mouse wheel zoom with ctrl (desktop testing) */
scroller.addEventListener('wheel', (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  zoomTo(scale * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
}, { passive: false });

/* ---------- zoom ---------- */
function zoomTo(ns, cx, cy, repaint = true) {
  ns = clamp(ns, minScale(), 4);
  if (Math.abs(ns - scale) < 1e-4) return;
  const r = scroller.getBoundingClientRect();
  const ax = cx - r.left, ay = cy - r.top;
  const k = ns / scale;
  const sx = scroller.scrollLeft + ax, sy = scroller.scrollTop + ay;
  scale = ns;
  fitMode = Math.abs(ns - fitScale()) < 0.005;
  layout();
  scroller.scrollLeft = sx * k - ax;
  scroller.scrollTop = sy * k - ay;
  if (repaint) scheduleRepaint();
}
function zoomCenter(f) {
  const r = scroller.getBoundingClientRect();
  zoomTo(scale * f, r.left + r.width / 2, r.top + r.height / 2);
}
function fitWidth() {
  const idx = currentIdx;
  scale = fitScale(); fitMode = true;
  layout(); scheduleRepaint();
  scrollToPage(idx, false);
}
function updZoomLabel() {
  const pct = Math.round(scale / fitScale() * 100);
  $('#bFit').textContent = fitMode ? 'Fit' : pct + '%';
}
let resizeT = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (!nb) return;
    if (fitMode) { const idx = currentIdx; scale = fitScale(); layout(); scheduleRepaint(); scrollToPage(idx, false); }
    else layout();
  }, 120);
});

/* ---------- page navigation ---------- */
function scrollToPage(i, smooth = true) {
  const p = nb.pages[clamp(i, 0, nb.pages.length - 1)];
  const v = p && views.get(p.id);
  if (!v) return;
  scroller.scrollTo({ top: Math.max(0, v.el.offsetTop - 12), behavior: smooth ? 'smooth' : 'auto' });
  currentIdx = nb.pages.indexOf(p);
  updateIndicator();
}
let scrollQ = false;
scroller.addEventListener('scroll', () => {
  if (scrollQ) return;
  scrollQ = true;
  requestAnimationFrame(() => { scrollQ = false; computeCurrent(); });
}, { passive: true });
function computeCurrent() {
  if (!nb) return;
  const mid = scroller.scrollTop + scroller.clientHeight * 0.4;
  let idx = 0;
  nb.pages.forEach((p, i) => { const v = views.get(p.id); if (v && v.el.offsetTop <= mid) idx = i; });
  if (idx !== currentIdx) { currentIdx = idx; updateIndicator(); }
}
function updateIndicator() {
  if (!nb) return;
  $('#bPage').textContent = (currentIdx + 1) + ' / ' + nb.pages.length;
}
function ensureVisible(pid) {
  const i = nb.pages.findIndex((p) => p.id === pid);
  const v = views.get(pid);
  if (i < 0 || !v) return;
  const top = v.el.offsetTop, bottom = top + v.el.offsetHeight;
  if (bottom < scroller.scrollTop || top > scroller.scrollTop + scroller.clientHeight) scrollToPage(i);
}

/* ---------- undo / redo ---------- */
function pushUndo(op) {
  undoStack.push(op);
  if (undoStack.length > 300) undoStack.shift();
  redoStack.length = 0;
  updUndo();
}
function updUndo() { $('#bUndo').disabled = !undoStack.length; $('#bRedo').disabled = !redoStack.length; }
function undo() { if (act) return; const op = undoStack.pop(); if (!op) return; applyOp(op, true); redoStack.push(op); updUndo(); dirty(); }
function redo() { if (act) return; const op = redoStack.pop(); if (!op) return; applyOp(op, false); undoStack.push(op); updUndo(); dirty(); }
function applyOp(op, inverse) {
  if (op.k === 'pages') {
    if (inverse) nb.pages.splice(op.idx, op.added.length, ...op.removed);
    else nb.pages.splice(op.idx, op.removed.length, ...op.added);
    const keep = scroller.scrollTop;
    buildPages();
    scroller.scrollTop = keep;
    scrollToPage(clamp(op.idx, 0, nb.pages.length - 1));
    return;
  }
  const p = nb.pages.find((q) => q.id === op.pid);
  if (!p) return;
  if (op.k === 'add') {
    if (inverse) { const i = p.strokes.lastIndexOf(op.s); if (i >= 0) p.strokes.splice(i, 1); }
    else p.strokes.push(op.s);
  } else if (op.k === 'erase') {
    if (inverse) for (let j = op.items.length - 1; j >= 0; j--) { const it = op.items[j]; p.strokes.splice(Math.min(it.i, p.strokes.length), 0, it.s); }
    else for (const it of op.items) { const i = p.strokes.indexOf(it.s); if (i >= 0) p.strokes.splice(i, 1); }
  } else if (op.k === 'clear') {
    p.strokes = inverse ? op.strokes.slice() : [];
  } else if (op.k === 'bg') {
    p.bg = inverse ? op.from : op.to;
    const v = views.get(p.id);
    if (v) v.el.className = 'page bg-' + p.bg;
  }
  const v = views.get(p.id);
  if (v) { v.p = p; if (v.mounted) renderInk(v); }
  ensureVisible(p.id);
}
function doOp(op) { applyOp(op, false); pushUndo(op); dirty(); }

/* ---------- page operations ---------- */
const newPage = (bg) => ({ id: uid(), bg, h: A4H, strokes: [] });
function addPage(bg) {
  prefs.lastBg = bg; savePrefs();

}
function setPageBg(bg) {
  const p = nb.pages[currentIdx];
  if (!p || p.bg === 'pdf' || p.bg === bg) return;
  prefs.lastBg = bg; savePrefs();
  doOp({ k: 'bg', pid: p.id, from: p.bg, to: bg });
}
function clearPage() {
  const p = nb.pages[currentIdx];
  if (!p || !p.strokes.length) return;

}
function deletePage() {
  const p = nb.pages[currentIdx];
  if (!p) return;
  const added = nb.pages.length === 1 ? [newPage(prefs.lastBg)] : [];
  doOp({ k: 'pages', idx: currentIdx, removed: [p], added });

}
function isUntouchedSinglePage(n) { return n.pages.length === 1 && n.pages[0].bg !== 'pdf' && !n.pages[0].strokes.length; }

let pdfMode = 'insert';
let forcedChapter = null;
function pickPdf(mode, chapter) {

  pdfMode = mode;

$('#pdfInput').addEventListener('change', async (e) => {

/* ---------- NCERT chapter recognition ---------- */
const normText = (s) => ' ' + String(s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
const chapterOf = (b) => b && CATALOG[b.subject] && CATALOG[b.subject][b.ch - 1];
const chapterName = (b) => SUBJECT_NAMES[b.subject] + ' Ch ' + b.ch + ' · ' + chapterOf(b);
async function pageText(pdf, n) {
  try { const tc = await (await pdf.getPage(n)).getTextContent(); return tc.items.map((it) => it.str).join(' '); }
  catch (e) { return ''; }
}
function matchTitle(text) {
  // the chapter title printed earliest on the page wins; ties go to the longer title
  const t = normText(text);
  let best = null;
  for (const subject of Object.keys(CATALOG)) {
    CATALOG[subject].forEach((title, i) => {
      const key = normText(title);
      const at = t.indexOf(key);
      if (at < 0) return;
      if (!best || at < best.at || (at === best.at && key.length > best.len)) best = { subject, ch: i + 1, at, len: key.length };
    });
  }
  return best && { subject: best.subject, ch: best.ch };
}
async function detectChapter(pdf, fileName) {
  for (let i = 1; i <= Math.min(2, pdf.numPages); i++) {
    const m = matchTitle(await pageText(pdf, i));
    if (m) return m;
  }
  const f = /j[eh](mh|sc)1(\d\d)/i.exec(fileName || '');
  if (f) {
    const b = { subject: f[1].toLowerCase() === 'mh' ? 'maths' : 'science', ch: parseInt(f[2], 10) };
    if (chapterOf(b)) return b;
  }
  return null;
}

async function importPdf(file, mode) {
  toast('Opening ' + file.name + ' …', null, 60000);
  const bytes = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(bytes.slice(0)) }).promise;
  const pdfId = uid();
  await DB.put('pdfs', { bytes, name: file.name }, pdfId);
  pdfDocs.set(pdfId, Promise.resolve(pdf));
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const pg = await pdf.getPage(i);
    const vp = pg.getViewport({ scale: 1 });
    pages.push({ id: uid(), bg: 'pdf', pdfId, pdfPage: i, h: Math.round(U * vp.height / vp.width), strokes: [] });
    if (i % 20 === 0) toast('Reading page ' + i + ' of ' + pdf.numPages + ' …', null, 60000);
  }
  const forced = forcedChapter;
  forcedChapter = null;
  const found = await detectChapter(pdf, file.name);
  const book = forced || found;
  const title = book ? chapterName(book) : (file.name.replace(/\.pdf$/i, '').slice(0, 60) || 'PDF notes');
  if (mode === 'new') {
    await saveNow();
    const n = { id: uid(), name: title, created: Date.now(), updated: Date.now(), pdfIds: [pdfId], pages };
    if (book) n.book = { subject: book.subject, ch: book.ch };
    await DB.put('notebooks', n);
    setNotebook(n, true);
  } else {
    nb.pdfIds = nb.pdfIds || [];
    nb.pdfIds.push(pdfId);
    if (isUntouchedSinglePage(nb)) {
      doOp({ k: 'pages', idx: 0, removed: [nb.pages[0]], added: pages });
      if (/^Untitled/.test(nb.name)) { nb.name = title; $('#nbName').value = title; }
      if (book && !nb.book) nb.book = { subject: book.subject, ch: book.ch };
    } else {
      doOp({ k: 'pages', idx: currentIdx + 1, removed: [], added: pages });
    }
  }
  const pagesMsg = pdf.numPages + (pdf.numPages === 1 ? ' page' : ' pages');
  if (forced && found && (found.subject !== forced.subject || found.ch !== forced.ch)) {
    toast(pagesMsg + ' added. This PDF looks like ' + chapterName(found) + ', not ' + chapterName(forced) + '. Check you picked the right file.', null, 9000);
  } else if (book) {
    toast(pagesMsg + ' added as ' + chapterName(book) + '.', null, 5000);
  } else {
    toast(pagesMsg + ' added from ' + file.name + '. Chapter not recognised; open the chapter library to file it under a chapter.', null, 7000);
  }
}

/* ---------- export ---------- */
function drawPattern(ctx, bg, hh) {
  // ctx is already scaled to page units
  ctx.fillStyle = bg === 'board' ? BOARD : '#ffffff';
  ctx.fillRect(0, 0, U, hh);
  if (bg === 'ruled') {
    ctx.fillStyle = '#b9d3ee';
    for (let y = 12; y < hh; y += 36) ctx.fillRect(0, y - 1.1, U, 1.1);
    ctx.fillStyle = '#f2a3a3'; ctx.fillRect(89, 0, 2, hh);
  } else if (bg === 'graph') {
    ctx.fillStyle = '#dbe7f3';
    for (let x = 0; x < U; x += 25) ctx.fillRect(x, 0, 1, hh);
    for (let y = 0; y < hh; y += 25) ctx.fillRect(0, y, U, 1);
    ctx.fillStyle = '#9fc0e0';
    for (let x = 0; x < U; x += 125) ctx.fillRect(x, 0, 1.2, hh);
    for (let y = 0; y < hh; y += 125) ctx.fillRect(0, y, U, 1.2);
  } else if (bg === 'dot') {
    ctx.fillStyle = '#a9b4c2';
    for (let y = 15; y < hh; y += 30) for (let x = 15; x < U; x += 30) { ctx.beginPath(); ctx.arc(x, y, 1.8, 0, Math.PI * 2); ctx.fill(); }
  }
}
async function renderPageImage(p, W) {
  const H = Math.round(W * p.h / U), k = W / U;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  if (p.bg === 'pdf') {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    try {
      const pdf = await getPdf(p.pdfId);
      const pg = await pdf.getPage(p.pdfPage);
      const vp1 = pg.getViewport({ scale: 1 });
      await pg.render({ canvasContext: ctx, viewport: pg.getViewport({ scale: W / vp1.width }) }).promise;
    } catch (e) { console.warn(e); }
  } else {
    ctx.setTransform(k, 0, 0, k, 0, 0);
    drawPattern(ctx, p.bg, p.h);
  }
  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawInk(ctx, p.strokes);
  return cv;
}
let exporting = false;
async function exportPdf() {
  if (exporting || !nb) return;
  if (!window.jspdf) { toast('The PDF writer did not load. Check the internet connection and reload the page.'); return; }
  exporting = true;
  try {
    await saveNow();
    const { jsPDF } = window.jspdf;
    let doc = null;
    for (let i = 0; i < nb.pages.length; i++) {
      toast('Preparing page ' + (i + 1) + ' of ' + nb.pages.length + ' …', null, 60000);
      const p = nb.pages[i];
      const cv = await renderPageImage(p, 1600);
      const img = cv.toDataURL('image/jpeg', 0.88);
      cv.width = 0; cv.height = 0;
      const wpt = 595.28, hpt = wpt * p.h / U, orient = hpt >= wpt ? 'portrait' : 'landscape';
      if (!doc) doc = new jsPDF({ unit: 'pt', format: [wpt, hpt], orientation: orient, compress: true });
      else doc.addPage([wpt, hpt], orient);
      doc.addImage(img, 'JPEG', 0, 0, wpt, hpt);
    }
    doc.setProperties({ title: nb.name, creator: 'Study Board' });
    const blob = doc.output('blob');
    const name = (nb.name.replace(/[\\/:*?"<>|]+/g, ' ').trim() || 'notes') + '.pdf';
    const file = new File([blob], name, { type: 'application/pdf' });
    toast('PDF ready: ' + nb.pages.length + (nb.pages.length === 1 ? ' page.' : ' pages.'), { label: 'Share or save', fn: () => deliver(file, blob, name), ms: 30000 });
  } catch (e) {
    console.warn(e);
    toast('Could not make the PDF: ' + (e && e.message ? e.message : 'unknown error'));
  } finally { exporting = false; }
}
async function deliver(file, blob, name) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ---------- toolbar ---------- */
function renderToolbar() {
  document.querySelectorAll('.tool').forEach((b) => {
    b.classList.toggle('on', b.dataset.tool === prefs.tool);
    b.setAttribute('aria-pressed', b.dataset.tool === prefs.tool ? 'true' : 'false');
  });
  $('#bShape').innerHTML = ICON[prefs.shape] + '<span class="caret"></span>';
  const gc = $('#gColors');
  gc.textContent = '';
  const isHl = prefs.tool === 'hl';
  const list = isHl ? HL : PEN, names = isHl ? HL_NAMES : PEN_NAMES;
  const cur = isHl ? prefs.hlColor : prefs.penColor;
  const passive = prefs.tool === 'eraser' || prefs.tool === 'laser';
  list.forEach((c, i) => {
    gc.append(h('button', {
      class: 'sw' + (c === cur && !passive ? ' on' : '') + (passive ? ' dim' : ''), style: '--c:' + c,
      title: names[i], 'aria-label': names[i], onclick: () => pickColor(c)
    }));
  });
  const custom = h('input', { type: 'color', 'aria-label': 'Choose any colour', value: list.includes(cur) ? '#ff5500' : cur });
  custom.addEventListener('input', (e) => pickColor(e.target.value));
  const isCustom = !list.includes(cur);
  gc.append(h('label', { class: 'sw custom x' + (isCustom && !passive ? ' on' : ''), title: 'Any colour' }, custom));

  const gs = $('#gSizes');
  gs.textContent = '';
  const key = prefs.tool === 'hl' ? 'hl' : prefs.tool === 'eraser' ? 'eraser' : 'pen';
  gs.style.visibility = prefs.tool === 'laser' ? 'hidden' : '';
  const dots = key === 'eraser' ? [6, 10, 15] : key === 'hl' ? [7, 11, 16] : [4, 7, 11];
  const labels = ['Thin', 'Medium', 'Thick'];
  dots.forEach((d, i) => {
    const sp = h('span');
    sp.style.width = sp.style.height = d + 'px';
    if (key === 'hl') { sp.style.borderRadius = '2px'; sp.style.background = prefs.hlColor; }
    if (key === 'eraser') { sp.style.background = 'transparent'; sp.style.border = '1.6px solid currentColor'; }
    gs.append(h('button', {
      class: 'ib sz' + (prefs.size[key] === i ? ' on' : ''), title: labels[i], 'aria-label': labels[i] + ' ' + key,
      onclick: () => { prefs.size[key] = i; savePrefs(); renderToolbar(); }
    }, sp));
  });
  document.body.classList.toggle('compact', !!prefs.compact);
  document.body.classList.toggle('finger', !!prefs.fingerDraw);
}
function pickColor(c) {
  if (prefs.tool === 'hl') prefs.hlColor = c;
  else { prefs.penColor = c; if (prefs.tool === 'eraser' || prefs.tool === 'laser') prefs.tool = 'pen'; }
  savePrefs(); renderToolbar();
}
function setTool(t) { prefs.tool = t; savePrefs(); renderToolbar(); }
$('#gTools').addEventListener('click', (e) => {
  const b = e.target.closest('.tool');
  if (!b) return;
  const t = b.dataset.tool;
  if (t === 'shape' && prefs.tool === 'shape') {
    openPop(b, (pop) => {
      pop.append(h('div', { class: 'ph' }, 'Shape'));
      for (const [k, label] of SHAPES) pop.append(h('button', {
        class: 'pi' + (prefs.shape === k ? ' on' : ''), html: ICON[k] + '<span>' + label + '</span>',
        onclick: () => { prefs.shape = k; savePrefs(); renderToolbar(); closePop(); }
      }));
      pop.append(h('div', { class: 'help' }, h('p', null, 'Lines snap to flat, upright and 45°. Near-squares and near-circles snap true.')));
    });
    return;
  }
  setTool(t);
});
$('#bUndo').addEventListener('click', undo);
$('#bRedo').addEventListener('click', redo);
$('#bFit').addEventListener('click', fitWidth);
$('#bPdf').addEventListener('click', () => pickPdf('insert'));

function bgPreview(bg) { return h('span', { class: 'prev bg-' + bg }); }
$('#bAdd').addEventListener('click', (e) => openPop(e.currentTarget, (pop) => {
  pop.append(h('div', { class: 'ph' }, 'Add a page after page ' + (currentIdx + 1)));
  for (const [k, label] of BG_TYPES) pop.append(h('button', { class: 'pi', onclick: () => { closePop(); addPage(k); } }, bgPreview(k), h('span', null, label)));
  const cur = nb.pages[currentIdx];
  pop.append(h('div', { class: 'ph' }, 'Change page ' + (currentIdx + 1) + ' to'));
  if (cur && cur.bg === 'pdf') pop.append(h('div', { class: 'help' }, h('p', null, 'This is a PDF page, so its paper cannot be changed.')));
  else for (const [k, label] of BG_TYPES) pop.append(h('button', {
    class: 'pi' + (cur && cur.bg === k ? ' on' : ''), onclick: () => { closePop(); setPageBg(k); }
  }, bgPreview(k), h('span', null, label)));
}));

$('#bPage').addEventListener('click', (e) => openPop(e.currentTarget, (pop) => {
  pop.append(h('div', { class: 'ph' }, 'Go to page'));
  pop.append(h('div', { class: 'nbrow' },
    h('button', { class: 'pi', disabled: currentIdx <= 0, onclick: () => { closePop(); scrollToPage(currentIdx - 1); } }, 'Previous page'),
    h('button', { class: 'pi', disabled: currentIdx >= nb.pages.length - 1, onclick: () => { closePop(); scrollToPage(currentIdx + 1); } }, 'Next page')));
  const g = h('div', { class: 'pgrid' });
  nb.pages.forEach((p, i) => g.append(h('button', {
    class: i === currentIdx ? 'on' : '', 'aria-label': 'Page ' + (i + 1),
    onclick: () => { closePop(); scrollToPage(i); }
  }, String(i + 1))));
  pop.append(g);
}));

$('#bBooks').addEventListener('click', async (e) => {
  const anchor = e.currentTarget;
  await saveNow();
  const all = (await DB.all('notebooks').catch(() => [])).sort((a, b) => b.updated - a.updated);
  openPop(anchor, (pop) => {
    pop.append(h('div', { class: 'ph' }, 'New'));
    pop.append(h('button', { class: 'pi', html: ICON.plus + '<span>New notebook (' + labelOf(prefs.lastBg) + ' paper)</span>', onclick: () => createNotebook(prefs.lastBg) }));
    pop.append(h('button', { class: 'pi', html: ICON.pdf + '<span>Open a PDF as a new notebook</span>', onclick: () => pickPdf('new') }));
    pop.append(h('button', { class: 'pi', html: ICON.book + '<span>Chapter library: Maths and Science</span>', onclick: () => showLibrary(anchor) }));
    pop.append(h('div', { class: 'ph' }, 'Notebooks on this iPad'));
    for (const n of all) {
      const open = h('button', { class: 'pi' + (nb && n.id === nb.id ? ' on' : ''), onclick: () => openNotebook(n.id) },
        h('span', null, n.name), h('span', { class: 'sub' }, n.pages.length + ' p · ' + shortDate(n.updated)));
      const del = h('button', { class: 'pi del', 'aria-label': 'Delete ' + n.name, title: 'Delete', html: ICON.trash });
      del.addEventListener('click', () => armed(del, 'Delete?', async () => {
        await deleteNotebook(n.id);
        closePop();
        toast('Deleted ' + n.name + '.');
      }));
      pop.append(h('div', { class: 'nbrow' }, open, del));
    }
  });
});
function labelOf(bg) { const f = BG_TYPES.find((b) => b[0] === bg); return f ? f[1].split(' ')[0].toLowerCase() : 'blank'; }
function shortDate(t) {
  const d = new Date(t), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return d.toLocaleDateString([], { day: 'numeric', month: 'short' });
}

$('#bMore').addEventListener('click', (e) => openPop(e.currentTarget, (pop) => {
  pop.append(h('button', { class: 'pi', html: ICON.share + '<span>Export notebook as PDF</span>', onclick: () => { closePop(); exportPdf(); } }));
  const clr = h('button', { class: 'pi', html: ICON.clear + '<span>Clear writing on page ' + (currentIdx + 1) + '</span>' });
  clr.addEventListener('click', () => armed(clr, 'Tap again to clear page ' + (currentIdx + 1), () => { closePop(); clearPage(); }));
  const del = h('button', { class: 'pi', html: ICON.trash + '<span>Delete page ' + (currentIdx + 1) + '</span>' });
  del.addEventListener('click', () => armed(del, 'Tap again to delete page ' + (currentIdx + 1), () => { closePop(); deletePage(); }));
  pop.append(clr, del);
  pop.append(h('div', { class: 'ph' }, 'Zoom (or pinch with two fingers)'));
  pop.append(h('div', { class: 'nbrow' },
    h('button', { class: 'pi', onclick: () => zoomCenter(0.8) }, 'Zoom out'),
    h('button', { class: 'pi', onclick: () => zoomCenter(1.25) }, 'Zoom in')));
  pop.append(h('div', { class: 'ph' }, 'Settings'));
  pop.append(h('button', {
    class: 'pi' + (prefs.fingerDraw ? ' on' : ''), html: ICON.hand + '<span>Draw with finger</span><span class="sub">' + (prefs.fingerDraw ? 'On' : 'Off') + '</span>',
    onclick: () => { prefs.fingerDraw = !prefs.fingerDraw; savePrefs(); renderToolbar(); closePop(); toast(prefs.fingerDraw ? 'Finger drawing on. Use two fingers to scroll and zoom.' : 'Finger drawing off. Only Apple Pencil writes.'); }
  }));
  pop.append(h('button', {
    class: 'pi' + (prefs.compact ? ' on' : ''), html: ICON.compact + '<span>Compact toolbar for class</span><span class="sub">' + (prefs.compact ? 'On' : 'Off') + '</span>',
    onclick: () => { prefs.compact = !prefs.compact; savePrefs(); renderToolbar(); closePop(); setTimeout(() => window.dispatchEvent(new Event('resize')), 50); }
  }));
  if (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) {
    pop.append(h('button', { class: 'pi', html: ICON.full + '<span>Full screen</span>', onclick: () => { closePop(); toggleFull(); } }));
  }
  pop.append(h('button', { class: 'pi', html: ICON.help + '<span>How to use</span>', onclick: () => showHelp(e.currentTarget) }));
}));
function toggleFull() {
  const d = document, el = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (r && r.catch) r.catch(() => toast('Full screen is not available here. Add Study Board to the Home Screen instead.')); }
  } catch (e) { toast('Full screen is not available here.'); }
}
function showHelp(anchor) {
  openPop(anchor, (pop) => {
    const d = h('div', { class: 'help' });
    d.innerHTML =
      '<p><b>Write</b> with Apple Pencil. Your hand and fingers never draw, so you can rest your palm on the screen.</p>' +
      '<p><b>Scroll</b> with one finger. <b>Zoom</b> by pinching with two fingers. Tap <b>Fit</b> to return to full width.</p>' +
      '<p><b>PDF:</b> the page-with-arrow button adds a PDF after the current page. Each PDF page becomes a page you can write on.</p>' +
      '<p><b>Blank paper:</b> the page-with-plus button adds a blank, ruled, graph, dotted or blackboard page, or changes the current one.</p>' +
      '<p><b>Laser</b> shows a red trail that fades, for pointing without leaving marks.</p>' +
      '<p><b>Shapes:</b> tap the shape button, then tap it again to choose line, arrow, rectangle or circle.</p>' +
      '<p><b>Eraser</b> removes whole strokes it touches. Undo brings them back.</p>' +
      '<p>Everything saves on this iPad automatically. Use <b>Export notebook as PDF</b> to send the notes.</p>';
    pop.append(h('div', { class: 'ph' }, 'How to use'), d);
  });
}
function armed(btn, label, fn) {
  if (btn.dataset.armed) { fn(); return; }
  const old = btn.innerHTML;
  btn.dataset.armed = '1';
  if (btn.classList.contains('del')) btn.textContent = label;
  else { const s = btn.querySelector('span'); if (s) s.textContent = label; }
  setTimeout(() => { if (btn.isConnected && btn.dataset.armed) { delete btn.dataset.armed; btn.innerHTML = old; } }, 3500);
}

/* ---------- popover + toast ---------- */
const pop = $('#pop');
let popAnchor = null;
function openPop(anchor, build) {
  if (popAnchor === anchor && !pop.hidden) { closePop(); return; }
  pop.textContent = '';
  pop.className = '';
  build(pop);
  pop.hidden = false;
  popAnchor = anchor;
  const r = anchor.getBoundingClientRect();
  const pw2 = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = clamp(r.left, 8, window.innerWidth - pw2 - 8) + 'px';
  let top = r.bottom + 6;
  if (top + ph > window.innerHeight - 8) top = Math.max(8, window.innerHeight - ph - 8);
  pop.style.top = top + 'px';
}
function closePop() { pop.hidden = true; popAnchor = null; }
document.addEventListener('pointerdown', (e) => {
  if (!pop.hidden && !pop.contains(e.target) && !(popAnchor && popAnchor.contains(e.target))) closePop();
}, true);
const toastEl = $('#toast');
let toastT = null;
function toast(msg, action, ms) {
  toastEl.textContent = '';
  toastEl.append(h('span', null, msg));
  if (action) toastEl.append(h('button', { onclick: () => { toastEl.hidden = true; action.fn(); } }, action.label));
  toastEl.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { toastEl.hidden = true; }, ms || (action && action.ms) || (action ? 8000 : 3200));
}

/* ---------- keyboard (for an iPad keyboard or a laptop) ---------- */
document.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod) return;
  const map = { p: 'pen', h: 'hl', e: 'eraser', l: 'laser', s: 'shape' };
  if (map[e.key]) setTool(map[e.key]);
  else if (e.key === 'Escape') closePop();
  else if (e.key === 'PageDown') { e.preventDefault(); scrollToPage(currentIdx + 1); }
  else if (e.key === 'PageUp') { e.preventDefault(); scrollToPage(currentIdx - 1); }
});

/* ---------- keep the screen awake while teaching ---------- */
let wl = null;
async function wake() {
  if (wl || !('wakeLock' in navigator)) return;
  try { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } catch (e) { /* not allowed here */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
window.addEventListener('pagehide', () => { saveNow(); });

/* ---------- start ---------- */
async function init() {
  if (pdfReady()) pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER_SRC;
  try { await DB.open(); }
  catch (e) { DB.useMemory(); setTimeout(() => toast('This browser is not letting Study Board save. Work will be lost when the page closes.', null, 8000), 400); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  let n = null;
  if (prefs.lastNb) n = await DB.get('notebooks', prefs.lastNb).catch(() => null);
  if (!n) {
    const all = await DB.all('notebooks').catch(() => []);
    all.sort((a, b) => b.updated - a.updated);
    n = all[0] || null;
  }
  if (!n) { n = seedNotebook(); await DB.put('notebooks', n).catch(() => {}); }
  renderToolbar();
  setNotebook(n, true);
  if (!prefs.seenTip) {
    prefs.seenTip = true; savePrefs();
    setTimeout(() => toast('Write with Apple Pencil. Scroll with one finger, pinch with two to zoom.', null, 7000), 300);
  }
}
init();
})();
</script>
