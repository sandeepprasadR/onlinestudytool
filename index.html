<html lang="en">
<head>

<title>Study Board</title>
<style>
/* Layout: one-screen app. A wrapping toolbar on top, a scrolling "desk" of paper pages below. */
:root {
  --ui-bg: #f4f6f9;
  --ui-panel: #ffffff;
  --ui-fg: #1c2430;
  --ui-muted: #5d6b7c;
  --ui-line: #d9dfe7;
  --accent: #2457d6;
  --accent-soft: #e3ebfc;
  --desk: #e4e8ee;
  --danger: #c2362b;
  --toast-bg: #1c2430;
  --toast-fg: #f4f6f9;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --board: #1f2f28;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ui-bg: #151a21; --ui-panel: #1d242d; --ui-fg: #e6ebf2; --ui-muted: #97a3b3; --ui-line: #2e3742;
    --accent: #7aa2ff; --accent-soft: #25324d; --desk: #0f1318; --danger: #ff6b5e;
    --toast-bg: #e6ebf2; --toast-fg: #151a21; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ui-bg: #151a21; --ui-panel: #1d242d; --ui-fg: #e6ebf2; --ui-muted: #97a3b3; --ui-line: #2e3742;
  --accent: #7aa2ff; --accent-soft: #25324d; --desk: #0f1318; --danger: #ff6b5e;
  --toast-bg: #e6ebf2; --toast-fg: #151a21; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--ui-bg); color: var(--ui-fg); font: 14px/1.4 var(--font-ui);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Toolbar */
#bar {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0;
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--ui-panel); border-bottom: 1px solid var(--ui-line);
  touch-action: manipulation; position: relative; z-index: 20;
}
.grp { display: flex; align-items: center; gap: 1px; padding: 0 5px; border-right: 1px solid var(--ui-line); min-height: 40px; }
.grp:first-child { padding-left: 0; }
.grp:last-child { border-right: 0; margin-left: auto; padding-right: 0; }
.ib {
  width: 38px; height: 40px; border: 0; border-radius: 10px; background: transparent;
  display: grid; place-items: center; padding: 0; position: relative;
}
.ib svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ib:hover { background: var(--accent-soft); }
.ib.on { background: var(--accent-soft); color: var(--accent); }
.ib:disabled { opacity: .35; cursor: default; background: transparent; }
.ib .caret { position: absolute; right: 3px; bottom: 3px; width: 0; height: 0; border-left: 4px solid transparent; border-top: 4px solid currentColor; transform: rotate(-45deg); opacity: .7; }
.tb { height: 40px; border: 0; border-radius: 10px; background: transparent; padding: 0 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tb:hover { background: var(--accent-soft); }
#nbName {
  width: 132px; height: 36px; border: 1px solid transparent; border-radius: 8px; background: transparent;
  color: var(--ui-fg); font: 600 16px var(--font-ui); padding: 0 8px; -webkit-user-select: text; user-select: text;
}
#nbName:hover, #nbName:focus { border-color: var(--ui-line); background: var(--ui-bg); outline: none; }
.sw {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ui-line); margin: 0 2px; padding: 0;
  background: var(--c); flex: none;
}
.sw.on { box-shadow: 0 0 0 2px var(--ui-panel), 0 0 0 4px var(--accent); }
.sw.custom { display: grid; place-items: center; background: conic-gradient(#e53935, #fdd835, #43a047, #1e88e5, #8e24aa, #e53935); position: relative; overflow: hidden; cursor: pointer; }
.sw.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
.sz span { display: block; border-radius: 50%; background: currentColor; }
.dim { opacity: .45; }
body.compact .x { display: none; }

/* Desk and pages */
#scroller {
  flex: 1; min-height: 0; overflow: auto; background: var(--desk);
  touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}
body.finger #scroller { touch-action: none; }
#pages { position: relative; padding: 16px 16px 40px; }
.page {
  position: relative; margin: 0 auto 28px; background-color: #fff;
  box-shadow: 0 1px 2px rgba(20,30,45,.18), 0 6px 18px rgba(20,30,45,.10);
  overflow: hidden; contain: layout paint;
}
.page::after {
  content: attr(data-n); position: absolute; right: 8px; bottom: 6px; font: 11px var(--font-ui);
  color: #8a96a6; pointer-events: none;
}
.page canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.page.pdf-error::before {
  content: "This PDF page could not be shown"; position: absolute; inset: 0; display: grid; place-items: center; color: #8a96a6;
}
/* Paper styles, scaled by --u (CSS px per page unit; a page is 1000 units wide) */
.bg-ruled {
  background-image:
    linear-gradient(to right, transparent calc(var(--u) * 90 - 1px), #f2a3a3 calc(var(--u) * 90 - 1px), #f2a3a3 calc(var(--u) * 90 + 1px), transparent calc(var(--u) * 90 + 1px)),
    linear-gradient(to bottom, transparent calc(100% - 1px), #b9d3ee calc(100% - 1px));
  background-size: 100% 100%, 100% calc(var(--u) * 36);
  background-position: 0 0, 0 calc(var(--u) * 12);
  background-repeat: no-repeat, repeat;
}
.bg-graph {
  background-image:
    linear-gradient(to right, #9fc0e0 1px, transparent 1px), linear-gradient(to bottom, #9fc0e0 1px, transparent 1px),
    linear-gradient(to right, #dbe7f3 1px, transparent 1px), linear-gradient(to bottom, #dbe7f3 1px, transparent 1px);
  background-size: calc(var(--u) * 125) calc(var(--u) * 125), calc(var(--u) * 125) calc(var(--u) * 125),
    calc(var(--u) * 25) calc(var(--u) * 25), calc(var(--u) * 25) calc(var(--u) * 25);
}
.bg-dot {
  background-image: radial-gradient(circle, #a9b4c2 calc(var(--u) * 1.8), transparent calc(var(--u) * 1.8 + .6px));
  background-size: calc(var(--u) * 30) calc(var(--u) * 30);
}
.page.bg-board { background-color: var(--board); }
.page.bg-board::after { color: #6f8a7d; }

/* Popover menus */
#pop {
  position: fixed; z-index: 50; min-width: 230px; max-width: min(340px, calc(100vw - 16px)); max-height: 72vh; overflow: auto;
  background: var(--ui-panel); color: var(--ui-fg); border: 1px solid var(--ui-line); border-radius: 14px;
  box-shadow: 0 12px 32px rgba(10,20,35,.22); padding: 6px; display: flex; flex-direction: column; gap: 2px;
}
.ph { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ui-muted); padding: 8px 10px 4px; }
.pi {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent;
  padding: 10px 12px; border-radius: 9px; min-height: 42px;
}
.pi:hover { background: var(--accent-soft); }
.pi.on { color: var(--accent); font-weight: 600; }
.pi.danger, .pi[data-armed] { color: var(--danger); }
.pi .sub { margin-left: auto; color: var(--ui-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.pi:disabled { opacity: .4; cursor: default; background: transparent; }
.pi svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.prev { width: 26px; height: 34px; border-radius: 3px; border: 1px solid var(--ui-line); flex: none; background-color: #fff; --u: .14px; }
.prev.bg-board { background-color: var(--board); }
.nbrow { display: flex; align-items: center; gap: 2px; }
.nbrow .pi { flex: 1; min-width: 0; }
.nbrow .pi span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nbrow .del { width: 40px; flex: none; justify-content: center; padding: 0; color: var(--ui-muted); }
.nbrow .del[data-armed] { width: auto; padding: 0 10px; color: var(--danger); }
.pgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 4px; }
.pgrid button { height: 40px; border: 1px solid var(--ui-line); border-radius: 8px; background: transparent; font-variant-numeric: tabular-nums; }
.pgrid button.on { background: var(--accent); border-color: var(--accent); color: var(--ui-panel); }
.help { padding: 6px 12px 10px; max-width: 320px; -webkit-user-select: text; user-select: text; }
.help p { margin: 6px 0; }
.help b { font-weight: 600; }
.notepin {
  position: absolute; z-index: 3; width: 30px; height: 30px; margin: -15px 0 0 -15px; padding: 0;
  border-radius: 50% 50% 50% 4px; border: 2px solid #b7791f; background: #ffe58a; color: #5c3d00;
  font: 700 13px var(--font-ui); box-shadow: 0 2px 6px rgba(0,0,0,.25); display: grid; place-items: center;
}
#noteCard {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  background: var(--ui-panel); border: 1px solid var(--ui-line); border-radius: 14px;
  box-shadow: 0 18px 50px rgba(10,20,35,.35); padding: 10px; display: flex; flex-direction: column; gap: 8px;
  touch-action: none; max-width: calc(100vw - 16px);
}
.notehead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.notehead b { margin-right: auto; }
.notepage { margin: 0; box-shadow: inset 0 0 0 1px var(--ui-line); border-radius: 6px; }
.notepage::after { content: none; }
#hw { position: fixed; inset: 0; z-index: 45; overflow: auto; background: var(--ui-bg); color: var(--ui-fg); -webkit-user-select: text; user-select: text; }
.hwin { max-width: 760px; margin: 0 auto; padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; }
.hwhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; position: sticky; top: 0; background: var(--ui-bg); padding-block: 6px; z-index: 1; }
.hwhead h2 { margin: 0 auto 0 0; font-size: 22px; }
.hwhead .sub { color: var(--ui-muted); }
#hw h3 { margin: 14px 0 2px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ui-muted); font-weight: 600; }
.hwcard { background: var(--ui-panel); border: 1px solid var(--ui-line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hwcard p { margin: 0; }
.hwtop { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hwtop b { font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.meta { color: var(--ui-muted); font-size: 13px; }
.note, .remarks { white-space: pre-wrap; overflow-wrap: anywhere; }
.remarks { background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--ui-bg); border: 1px solid var(--ui-line); white-space: nowrap; }
.chip.ok { background: #e3f4e8; border-color: #9fd3ae; color: #1e6b37; }
.chip.wait { background: #fff4dc; border-color: #f0cf85; color: #7a5300; }
.chip.sub-maths { color: var(--accent); }
.chip.sub-science { color: #15803d; }
.hwacts { display: flex; flex-wrap: wrap; gap: 8px; }
.hwbtn { height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; }
.hwbtn:disabled { opacity: .5; }
.tb.danger, .tb[data-armed] { color: var(--danger); }
.hwfield { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.hwfield > span { font-size: 13px; color: var(--ui-muted); }
.hwinput { width: 100%; min-height: 42px; border: 1px solid var(--ui-line); border-radius: 9px; padding: 8px 10px; font: 16px var(--font-ui); background: var(--ui-bg); color: var(--ui-fg); }
textarea.hwinput { resize: vertical; }
.hwrow { display: flex; flex-wrap: wrap; gap: 10px; }
.pushbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; margin: 0 0 8px; border-radius: 10px; background: #fff7d6; font-size: 14px; }
.pushbar[hidden] { display: none; }
.hwroles { display: flex; flex-wrap: wrap; gap: 16px; }
.hwcheck { display: flex; align-items: center; gap: 6px; }
.hwmsg { margin: 0; padding: 8px 12px; border-radius: 9px; background: var(--accent-soft); }
.hwmsg.bad { background: #fde7e5; color: #8f1f15; }
.empty { color: var(--ui-muted); margin: 0; }
.hwfoot { margin-top: 18px; }
.tb.on { background: var(--accent-soft); color: var(--accent); }
#bBooks.badge::after { content: ""; position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px var(--ui-panel); }
.chat { display: flex; flex-direction: column; gap: 10px; }
.chatlist { display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 230px); min-height: 200px; overflow: auto; padding: 10px; background: var(--ui-panel); border: 1px solid var(--ui-line); border-radius: 12px; }
.chatday { align-self: center; font-size: 12px; color: var(--ui-muted); padding: 6px 0 2px; }
.bubble { max-width: 80%; align-self: flex-start; background: var(--ui-bg); border: 1px solid var(--ui-line); border-radius: 12px 12px 12px 4px; padding: 6px 10px; }
.bubble.mine { align-self: flex-end; background: var(--accent-soft); border-color: transparent; border-radius: 12px 12px 4px 12px; }
.bubble .who { font-size: 11px; color: var(--ui-muted); }
.bubble .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.chatform { display: flex; gap: 8px; align-items: flex-end; }
.chatform textarea { flex: 1; }
.tutornote { margin: 0; padding: 8px 12px; border-radius: 9px; background: var(--accent-soft); font-size: 14px; }
.bubble.tutor { max-width: 92%; }
.rich .para { margin: 2px 0; }
.rich .gap { height: 6px; }
.rich .li { display: flex; gap: 6px; margin: 2px 0 2px 4px; }
.rich .mark { color: var(--accent); font-weight: 700; flex: none; min-width: 14px; }
.suggest { align-self: flex-start; border: 1px solid var(--ui-line); height: auto; min-height: 36px; padding: 6px 10px; text-align: left; white-space: normal; }
details summary { cursor: pointer; color: var(--accent); }
.micbtn { display: flex; align-items: center; gap: 4px; height: 42px; border: 1px solid var(--ui-line); }
.micbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.callrow { display: flex; align-items: center; gap: 10px; }
.callbtn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; line-height: 40px; }
.callbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }
@media (max-width: 560px) { .micbtn span { display: none; } .micbtn { padding: 0 10px; } }
.bigpic { position: fixed; inset: 0; z-index: 70; background: rgba(10,14,20,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
.docview { position: fixed; inset: 0; z-index: 70; background: rgba(10,14,20,.95); display: flex; flex-direction: column; }
.dochead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); color: #fff; }
.dochead strong { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dochead .tb { color: #fff; }
.docpages { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 12px 24px; }
.docpages canvas, .docpages img { max-width: 100%; height: auto; background: #fff; border-radius: 4px; }
.bigpic img { max-width: 100%; max-height: calc(100% - 70px); object-fit: contain; background: #fff; border-radius: 6px; }
.chatpic img { min-height: 120px; min-width: 120px; }
.chatpic { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.chatpic img { max-width: min(320px, 70vw); max-height: 360px; border-radius: 8px; border: 1px solid var(--ui-line); cursor: pointer; background: #fff; }
.voice { display: flex; flex-direction: column; gap: 4px; min-width: 220px; }
.voice audio { width: 100%; max-width: 300px; height: 36px; }
.recbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--danger); border-radius: 12px; background: var(--ui-panel); }
.recdot { width: 12px; height: 12px; border-radius: 50%; background: var(--danger); }
@media (prefers-reduced-motion: no-preference) { .recdot { animation: blink 1s infinite; } @keyframes blink { 50% { opacity: .25; } } }
.linkbtn { border: 0; background: none; color: var(--ui-muted); text-decoration: underline; padding: 0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.ok { background: #173a24; color: #9fe0b3; border-color: #2b6b40; } :root:not([data-theme="light"]) .chip.wait { background: #3d3013; color: #f3d38a; border-color: #6b5520; } :root:not([data-theme="light"]) .hwmsg.bad { background: #4a1d19; color: #ffc2bb; } }
:root[data-theme="dark"] .chip.ok { background: #173a24; color: #9fe0b3; border-color: #2b6b40; }
:root[data-theme="dark"] .chip.wait { background: #3d3013; color: #f3d38a; border-color: #6b5520; }
:root[data-theme="dark"] .hwmsg.bad { background: #4a1d19; color: #ffc2bb; }
a.pi { color: inherit; text-decoration: none; }
.meetin { width: 100%; height: 42px; border: 1px solid var(--ui-line); border-radius: 9px; padding: 0 10px; font: 16px var(--font-ui); background: var(--ui-bg); color: var(--ui-fg); -webkit-user-select: text; user-select: text; }
.formmsg { font-size: 13px; color: var(--ui-muted); }
.formmsg.err { color: var(--danger); }
form.help .pi { justify-content: center; border: 1px solid var(--accent); }
#pop.wide { min-width: min(400px, calc(100vw - 16px)); max-width: min(440px, calc(100vw - 16px)); }
.chn { width: 22px; flex: none; text-align: right; color: var(--ui-muted); font-variant-numeric: tabular-nums; }
.cht { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tick {
  width: 26px; height: 26px; flex: none; margin: 0 4px 0 6px; border-radius: 7px; border: 2px solid var(--ui-line);
  background: transparent; display: grid; place-items: center; padding: 0;
}
.tick.on { background: var(--accent); border-color: var(--accent); }
.pi .sub.pending { color: var(--danger); font-weight: 600; }
.tick.on::after { content: ""; width: 10px; height: 6px; border: solid var(--ui-panel); border-width: 0 0 2.5px 2.5px; transform: translate(0, -1px) rotate(-45deg); }
.filesel { max-width: 150px; height: 36px; border: 1px solid var(--ui-line); border-radius: 8px; background: var(--ui-panel); color: var(--ui-fg); font: inherit; padding: 0 6px; }

/* Toast */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 32px);
  background: var(--toast-bg); color: var(--toast-fg); padding: 10px 14px; border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
#toast button { border: 0; border-radius: 8px; padding: 8px 12px; background: var(--accent); color: #fff; font-weight: 600; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  #toast:not([hidden]) { animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
}
@media (max-width: 700px) {
  #nbName { width: 110px; }
  .grp { padding: 0 3px; }
}
</style>
</head>
<body>
<header id="bar" role="toolbar" aria-label="Writing tools">
  <div class="grp">
    <button class="ib" id="bBooks" title="Notebooks" aria-label="Notebooks"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <input id="nbName" class="x" aria-label="Notebook name" maxlength="60" autocomplete="off" spellcheck="false">
  </div>

// NCERT Class 10 (English medium) textbooks, current rationalised editions

};
const SUBJECT_NAMES = { maths: 'Maths', science: 'Science' };
const SHAPES = [['line', 'Straight line'], ['arrow', 'Arrow'], ['rect', 'Rectangle'], ['ellipse', 'Circle or ellipse']];
const ICON = {
  line: '<svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg>',
  arrow: '<svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg>',
  rect: '<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>',

  chat: '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12.5h5"/></svg>',
  school: '<svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>',
  help: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>'
};

/* ---------- small helpers ---------- */
const $ = (s) => document.querySelector(s);
const scroller = $('#scroller');
const pagesEl = $('#pages');
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function h(tag, attrs, ...kids) {

  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);

/* ---------- preferences (per device) ---------- */
const prefs = Object.assign({
  tool: 'pen', shape: 'line', penColor: PEN[0], hlColor: HL[0],
  size: { pen: 1, hl: 1, eraser: 1 }, fingerDraw: false, compact: false, lastBg: 'graph', lastNb: null, seenTip: false
}, (() => { try { return JSON.parse(localStorage.getItem('studyboard-prefs') || '{}'); } catch (e) { return {}; } })());
function savePrefs() { try { localStorage.setItem('studyboard-prefs', JSON.stringify(prefs)); } catch (e) { /* storage blocked */ } }

/* ---------- storage: IndexedDB with an in-memory fallback ---------- */
const DB = {
  db: null, mem: null,
  open() {
    return new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open('studyboard', 1); } catch (e) { rej(e); return; }
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('notebooks')) d.createObjectStore('notebooks', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('pdfs')) d.createObjectStore('pdfs');
      };
      r.onsuccess = () => {
        const d = r.result;
        this.db = d;
        // iPadOS closes the connection when the app goes to the background (e.g. while Meet broadcasts)
        d.onclose = () => { if (this.db === d) this.db = null; };
        d.onversionchange = () => { d.close(); if (this.db === d) this.db = null; };
        res();
      };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('Storage is blocked'));
    });
  },
  useMemory() { this.mem = { notebooks: new Map(), pdfs: new Map() }; },
  async run(store, mode, fn) {
    try { return await this.once(store, mode, fn); }
    catch (e) {

      if (!e || !/InvalidState|clos|abort|UnknownError/i.test((e.name || '') + ' ' + (e.message || ''))) throw e;
      try { if (this.db) this.db.close(); } catch (err) {}
      this.db = null;
      await this.open();
      return this.once(store, mode, fn);
    }
  },
  async once(store, mode, fn) {
    if (!this.db) await this.open();
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const rq = fn(t.objectStore(store));
      let out;
      if (rq) rq.onsuccess = () => { out = rq.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Storage full or blocked'));
    });
  },
  async get(store, key) { if (this.mem) return this.mem[store].get(key); return this.run(store, 'readonly', (s) => s.get(key)); },
  async put(store, val, key) {
    if (this.mem) { this.mem[store].set(key === undefined ? val.id : key, val); return; }
    return this.run(store, 'readwrite', (s) => (key === undefined ? s.put(val) : s.put(val, key)));
  },
  async del(store, key) { if (this.mem) { this.mem[store].delete(key); return; } return this.run(store, 'readwrite', (s) => s.delete(key)); },
  async all(store) { if (this.mem) return [...this.mem[store].values()]; return this.run(store, 'readonly', (s) => s.getAll()); }
};

/* ---------- state ---------- */
let nb = null;                 // current notebook
let scale = 1;                 // CSS px per page unit
let fitMode = true;
let currentIdx = 0;
const views = new Map();       // page id -> view
let undoStack = [], redoStack = [];
const pdfDocs = new Map();     // pdf id -> Promise<PDFDocumentProxy>

/* ---------- PDFs ---------- */
function pdfReady() { return !!window.pdfjsLib; }
function getPdf(id) {
  if (!pdfDocs.has(id)) {
    const pr = (async () => {
      if (!pdfReady()) throw new Error('The PDF reader did not load. Check the internet connection and reload.');
      const rec = await DB.get('pdfs', id);
      if (!rec) throw new Error('The PDF file is missing from this iPad.');
      return pdfjsLib.getDocument({ data: new Uint8Array(rec.bytes.slice(0)) }).promise;
    })();
    pr.catch(() => pdfDocs.delete(id));
    pdfDocs.set(id, pr);
  }
  return pdfDocs.get(id);
}

/* ---------- saving ---------- */
let saveTimer = null;
function dirty() {
  if (!nb) return;
  nb.updated = Date.now();
  // save at most 0.7 s after the first change, even while writing continues
  if (!saveTimer) saveTimer = setTimeout(saveNow, 700);
}
async function saveNow() {
  clearTimeout(saveTimer); saveTimer = null;
  if (!nb) return;
  try { await DB.put('notebooks', nb); }
  catch (e) { toast('Could not save on this iPad: ' + (e && e.message ? e.message : 'storage error')); }
}

/* ---------- page views ---------- */
const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    const v = views.get(e.target.dataset.id);
    if (!v) continue;
    if (e.isIntersecting) mount(v); else unmount(v);
  }
}, { root: scroller, rootMargin: '120% 0px 120% 0px' });

function fitScale() { return Math.max(0.2, (scroller.clientWidth - 32) / U); }
function minScale() { return fitScale() * 0.4; }

function buildPages() {
  closeNote();
  io.disconnect();
  for (const v of views.values()) unmount(v);
  views.clear();
  pagesEl.textContent = '';
  nb.pages.forEach((p, i) => {
    const el = h('div', { class: 'page bg-' + p.bg, 'data-id': p.id, 'data-n': String(i + 1) });
    views.set(p.id, { p, el, ink: null, bg: null, mounted: false, token: 0, task: null });
    for (const n of p.notes || []) el.append(notePin(p, n));
    pagesEl.append(el);
  });
  layout();
  for (const v of views.values()) io.observe(v.el);
  currentIdx = clamp(currentIdx, 0, nb.pages.length - 1);
  updateIndicator();
}

function layout() {
  const w = U * scale;
  pagesEl.style.width = Math.max(scroller.clientWidth, w + 32) + 'px';
  pagesEl.style.setProperty('--u', scale + 'px');
  for (const v of views.values()) {
    v.el.style.width = w + 'px';
    v.el.style.height = (v.p.h * scale) + 'px';
  }
  positionPins();
  updZoomLabel();
}

function pixelRatio(p, sc) {
  let r = Math.min(window.devicePixelRatio || 1, 2);
  const w = U * sc * r, hh = p.h * sc * r, max = 8e6;
  if (w * hh > max) r *= Math.sqrt(max / (w * hh));
  return r;
}

function mount(v) {
  if (v.mounted) return;
  v.mounted = true;
  v.ink = h('canvas', { class: 'ink' });
  v.el.append(v.ink);
  if (v.p.bg === 'pdf') { v.bg = h('canvas', { class: 'pdfbg' }); v.el.prepend(v.bg); }
  paint(v);
}
function unmount(v) {
  if (!v.mounted) return;
  v.mounted = false; v.token++;
  if (v.task) { try { v.task.cancel(); } catch (e) {} v.task = null; }
  for (const c of [v.ink, v.bg]) if (c) { c.width = 0; c.height = 0; c.remove(); }
  v.ink = v.bg = null;
  if (live.view === v) detachLive();
}
function paint(v) {
  if (!v.mounted) return;
  const sc = v.s || scale;
  const r = pixelRatio(v.p, sc);
  const W = Math.round(U * sc * r), H = Math.round(v.p.h * sc * r);

  if (v.bg) renderPdfBg(v, W, H);

function renderInk(v) {

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, c.width, c.height);
  const k = c.width / U;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawInk(ctx, v.p.strokes);
}
async function renderPdfBg(v, W, H) {
  const tok = ++v.token;
  if (v.task) { try { v.task.cancel(); } catch (e) {} v.task = null; }
  try {
    const pdf = await getPdf(v.p.pdfId);
    if (tok !== v.token || !v.mounted) return;
    const page = await pdf.getPage(v.p.pdfPage);
    if (tok !== v.token || !v.mounted) return;
    const vp1 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: W / vp1.width });
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const octx = off.getContext('2d');
    octx.fillStyle = '#fff'; octx.fillRect(0, 0, W, H);
    v.task = page.render({ canvasContext: octx, viewport: vp });
    await v.task.promise;
    v.task = null;
    if (tok !== v.token || !v.mounted) { off.width = 0; return; }
    v.bg.width = W; v.bg.height = H;
    v.bg.getContext('2d').drawImage(off, 0, 0);
    off.width = 0;
    v.el.classList.remove('pdf-error');
  } catch (e) {
    if (e && e.name === 'RenderingCancelledException') return;
    console.warn(e);
    if (v.mounted && tok === v.token) v.el.classList.add('pdf-error');
  }
}
let repaintTimer = null;
function scheduleRepaint() {
  clearTimeout(repaintTimer);
  repaintTimer = setTimeout(() => { for (const v of views.values()) if (v.mounted) paint(v); }, 160);
}

/* ---------- drawing strokes ---------- */
// stroke: { t: 'pen'|'hl'|'line'|'arrow'|'rect'|'ellipse', c: colour, w: width, pts }
// pen/hl pts: x, y, pressure triples; shapes: x1, y1, x2, y2
const pw = (pr) => 0.45 + 0.95 * pr;
function drawInk(ctx, strokes) {
  for (const s of strokes) if (s.t === 'hl') drawStroke(ctx, s);
  for (const s of strokes) if (s.t !== 'hl') drawStroke(ctx, s);
}
function drawStroke(ctx, s) {
  const p = s.pts;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = s.c; ctx.fillStyle = s.c;
  if (s.t === 'pen') {
    const n = p.length / 3;
    if (n === 1) { ctx.beginPath(); ctx.arc(p[0], p[1], s.w * pw(p[2]) / 2, 0, Math.PI * 2); ctx.fill(); return; }
    let px = p[0], py = p[1];
    for (let i = 1; i < n - 1; i++) {
      const x = p[i * 3], y = p[i * 3 + 1], nx = p[i * 3 + 3], ny = p[i * 3 + 4];
      const mx = (x + nx) / 2, my = (y + ny) / 2;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.quadraticCurveTo(x, y, mx, my);
      ctx.lineWidth = s.w * pw(p[i * 3 + 2]); ctx.stroke();
      px = mx; py = my;
    }
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(p[(n - 1) * 3], p[(n - 1) * 3 + 1]);
    ctx.lineWidth = s.w * pw(p[(n - 1) * 3 + 2]); ctx.stroke();
    return;
  }
  if (s.t === 'hl') {
    const n = p.length / 3;
    ctx.save(); ctx.globalAlpha = 0.38; ctx.lineWidth = s.w;
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    if (n === 1) ctx.lineTo(p[0] + 0.01, p[1]);
    for (let i = 1; i < n - 1; i++) {
      const x = p[i * 3], y = p[i * 3 + 1];
      ctx.quadraticCurveTo(x, y, (x + p[i * 3 + 3]) / 2, (y + p[i * 3 + 4]) / 2);
    }
    if (n > 1) ctx.lineTo(p[(n - 1) * 3], p[(n - 1) * 3 + 1]);
    ctx.stroke(); ctx.restore();
    return;
  }
  const [x1, y1, x2, y2] = p;
  ctx.lineWidth = s.w;
  ctx.beginPath();
  if (s.t === 'line') { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); }
  else if (s.t === 'arrow') {
    const hd = arrowHead(s);
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.moveTo(hd[0], hd[1]); ctx.lineTo(x2, y2); ctx.lineTo(hd[2], hd[3]);
  }
  else if (s.t === 'rect') ctx.rect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
  else if (s.t === 'ellipse') ctx.ellipse((x1 + x2) / 2, (y1 + y2) / 2, Math.abs(x2 - x1) / 2, Math.abs(y2 - y1) / 2, 0, 0, Math.PI * 2);
  ctx.stroke();
}
function arrowHead(s) {
  const [x1, y1, x2, y2] = s.pts;
  const a = Math.atan2(y2 - y1, x2 - x1), L = Math.max(14, s.w * 4.5), sp = 0.45;
  return [x2 - L * Math.cos(a - sp), y2 - L * Math.sin(a - sp), x2 - L * Math.cos(a + sp), y2 - L * Math.sin(a + sp)];
}

/* ---------- eraser hit testing ---------- */
const bbCache = new WeakMap();
function polyline(s) {
  const p = s.pts;

/* photos (homework pages) become a PDF so they behave like any other PDF page */
function loadImage(f) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error(f.name + ' is not a photo this browser can open')); };
    im.src = url;
  });
}
async function imagesToPdf(files, maxPx = 2000, quality = 0.85) {
  if (!window.jspdf) throw new Error('The PDF writer did not load. Check the internet connection and reload the page.');
  const { jsPDF } = window.jspdf;
  let doc = null;
  for (let i = 0; i < files.length; i++) {
    toast('Preparing photo ' + (i + 1) + ' of ' + files.length + ' …', null, 60000);
    const img = await loadImage(files[i]);
    const k = Math.min(1, maxPx / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * k)), hh = Math.max(1, Math.round(img.naturalHeight * k));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = hh;
    const c = cv.getContext('2d');
    c.fillStyle = '#fff'; c.fillRect(0, 0, w, hh);
    c.drawImage(img, 0, 0, w, hh);
    const data = cv.toDataURL('image/jpeg', quality);
    cv.width = 0; cv.height = 0;
    const wpt = 595.28, hpt = wpt * hh / w, orient = hpt >= wpt ? 'portrait' : 'landscape';
    if (!doc) doc = new jsPDF({ unit: 'pt', format: [wpt, hpt], orientation: orient, compress: true });
    else doc.addPage([wpt, hpt], orient);
    doc.addImage(data, 'JPEG', 0, 0, wpt, hpt);
  }
  const day = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  const name = 'Homework ' + day + (files.length > 1 ? ' (' + files.length + ' photos)' : '') + '.pdf';
  return new File([doc.output('arraybuffer')], name, { type: 'application/pdf' });
}

/* ---------- NCERT chapter recognition ---------- */
const normText = (s) => ' ' + String(s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
const chapterOf = (b) => b && CATALOG[b.subject] && CATALOG[b.subject][b.ch - 1];
const chapterName = (b) => SUBJECT_NAMES[b.subject] + ' Ch ' + b.ch + ' · ' + chapterOf(b);
async function pageText(pdf, n) {
  try { const tc = await (await pdf.getPage(n)).getTextContent(); return tc.items.map((it) => it.str).join(' '); }
  catch (e) { return ''; }
}
function matchTitle(text) {
  // the chapter title printed earliest on the page wins; ties go to the longer title
  const t = normText(text);
  let best = null;
  for (const subject of Object.keys(CATALOG)) {
    CATALOG[subject].forEach((title, i) => {
      const key = normText(title);
      const at = t.indexOf(key);
      if (at < 0) return;
      if (!best || at < best.at || (at === best.at && key.length > best.len)) best = { subject, ch: i + 1, at, len: key.length };
    });
  }
  return best && { subject: best.subject, ch: best.ch };
}
async function detectChapter(pdf, fileName) {
  for (let i = 1; i <= Math.min(2, pdf.numPages); i++) {
    const m = matchTitle(await pageText(pdf, i));
    if (m) return m;
  }
  const f = /j[eh](mh|sc)1(\d\d)/i.exec(fileName || '');
  if (f) {
    const b = { subject: f[1].toLowerCase() === 'mh' ? 'maths' : 'science', ch: parseInt(f[2], 10) };
    if (chapterOf(b)) return b;
  }
  return null;
}

async function importPdf(file, mode) {
  const fromLib = forcedChapter && /^(Maths|Science) Ch /.test(file.name);
  toast('Opening ' + file.name + ' …', null, 60000);
  const bytes = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(bytes.slice(0)) }).promise;
  const pdfId = uid();
  await DB.put('pdfs', { bytes, name: file.name }, pdfId);
  pdfDocs.set(pdfId, Promise.resolve(pdf));
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const pg = await pdf.getPage(i);
    const vp = pg.getViewport({ scale: 1 });
    pages.push({ id: uid(), bg: 'pdf', pdfId, pdfPage: i, h: Math.round(U * vp.height / vp.width), strokes: [] });
    if (i % 20 === 0) toast('Reading page ' + i + ' of ' + pdf.numPages + ' …', null, 60000);
  }
  const forced = forcedChapter;
  forcedChapter = null;
  const found = await detectChapter(pdf, file.name);
  const book = forced || found;
  const title = book ? chapterName(book) : (file.name.replace(/\.pdf$/i, '').slice(0, 60) || 'PDF notes');
  if (mode === 'new') {
    await saveNow();
    const n = { id: uid(), name: title, created: Date.now(), updated: Date.now(), pdfIds: [pdfId], pages };
    if (book) n.book = { subject: book.subject, ch: book.ch };
    await DB.put('notebooks', n);
    setNotebook(n, true);
    if (book && canShare() && !fromLib) shareChapter(book, bytes, file.name).catch((e) => console.warn(e));
  } else {
    nb.pdfIds = nb.pdfIds || [];
    nb.pdfIds.push(pdfId);
    if (isUntouchedSinglePage(nb)) {
      doOp({ k: 'pages', idx: 0, removed: [nb.pages[0]], added: pages });
      if (/^Untitled/.test(nb.name)) { nb.name = title; $('#nbName').value = title; }
      if (book && !nb.book) nb.book = { subject: book.subject, ch: book.ch };
    } else {
      doOp({ k: 'pages', idx: currentIdx + 1, removed: [], added: pages });
    }
  }
  const pagesMsg = pdf.numPages + (pdf.numPages === 1 ? ' page' : ' pages');
  if (forced && found && (found.subject !== forced.subject || found.ch !== forced.ch)) {
    toast(pagesMsg + ' added. This PDF looks like ' + chapterName(found) + ', not ' + chapterName(forced) + '. Check you picked the right file.', null, 9000);
  } else if (book) {
    toast(pagesMsg + ' added as ' + chapterName(book) + '.', null, 5000);
  } else if (/^Homework /.test(file.name)) {
    toast(pagesMsg + ' of homework added. Mark it with the pen, then export it from the ⋯ menu to send back.', null, 6000);
  } else {
    toast(pagesMsg + ' added from ' + file.name + '. Chapter not recognised; open the chapter library to file it under a chapter.', null, 7000);
  }
}

/* many chapter PDFs at once: each becomes its own notebook, named and filed by chapter */
async function importManyPdfs(files, fromLib) {
  if (!files.length) { toast('Choose the chapter PDFs.'); return; }
  await saveNow();
  const all = await DB.all('notebooks').catch(() => []);
  const have = new Set(all.filter((n) => n.book).map((n) => n.book.subject + '-' + n.book.ch));
  const added = [], skipped = [], unknown = [], failed = [], tooBig = [], notShared = [];
  forcedChapter = null;
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    toast('Reading ' + (i + 1) + ' of ' + files.length + ': ' + file.name + ' …', null, 120000);
    try {
      const bytes = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(bytes.slice(0)) }).promise;
      const book = await detectChapter(pdf, file.name);
      const key = book ? book.subject + '-' + book.ch : null;
      if (key && have.has(key)) { skipped.push(chapterName(book)); await pdf.destroy(); continue; }
      const pdfId = uid();
      const pages = [];
      for (let j = 1; j <= pdf.numPages; j++) {
        const vp = (await pdf.getPage(j)).getViewport({ scale: 1 });
        pages.push({ id: uid(), bg: 'pdf', pdfId, pdfPage: j, h: Math.round(U * vp.height / vp.width), strokes: [] });
      }
      await pdf.destroy();
      await DB.put('pdfs', { bytes, name: file.name }, pdfId);
      const title = book ? chapterName(book) : (file.name.replace(/\.pdf$/i, '').slice(0, 60) || 'PDF notes');
      const n = { id: uid(), name: title, created: Date.now(), updated: Date.now(), pdfIds: [pdfId], pages };
      if (book) {
        n.book = { subject: book.subject, ch: book.ch }; have.add(key); added.push(book);
        if (!fromLib && canShare()) { try { if (await shareChapter(book, bytes, file.name) === 'big') tooBig.push(chapterName(book)); } catch (e) { console.warn(e); notShared.push(chapterName(book)); } }
      }
      else unknown.push(file.name);
      await DB.put('notebooks', n);
    } catch (e) { console.warn(e); failed.push(file.name); }
  }
  added.sort((a, b) => (a.subject + a.ch).localeCompare(b.subject + b.ch, undefined, { numeric: true }));
  const parts = [];
  for (const subject of Object.keys(CATALOG)) {
    const chs = added.filter((b) => b.subject === subject).map((b) => b.ch).sort((a, b) => a - b);
    if (chs.length) parts.push(SUBJECT_NAMES[subject] + ' ' + chs.join(', '));
  }
  let msg = added.length ? 'Filed ' + added.length + (added.length === 1 ? ' chapter: ' : ' chapters: ') + parts.join('; ') + '.' : 'No new chapters filed.';
  if (skipped.length) msg += ' Already there: ' + skipped.length + '.';
  if (unknown.length) msg += ' Not recognised, kept under their file names: ' + unknown.join(', ') + '.';
  if (failed.length) msg += ' Could not open: ' + failed.join(', ') + '.';
  if (!fromLib && added.length) {
    if (canShare()) msg += tooBig.length || notShared.length ? ' Not shared online: ' + tooBig.concat(notShared).join(', ') + '.' : ' Also shared online for your other devices.';
    else msg += ' (Sign in as the teacher under Homework to share chapters with your other devices.)';
  }
  toast(msg, { label: 'Open chapter library', fn: () => showLibrary($('#bBooks')), ms: 20000 });
}

/* ---------- chapter library ---------- */
/* shared online chapter library (needs the Netlify version and the class code) */
const LIB = { items: null, err: '' };
const canShare = () => HW.code && HW.role === 'teacher';
async function loadLib() {
  if (!HW.code) { LIB.items = null; LIB.err = 'signin'; return; }
  try { const r = await api('lib'); LIB.items = r.items || []; LIB.err = ''; }
  catch (e) { LIB.items = null; LIB.err = e.message; }
}
// small pieces so each upload finishes even on a slow connection; each piece is retried if the connection drops
const LIB_CHUNK = 1500000;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function shareChapter(book, bytes, name, onPart) {
  if (!canShare()) return 'skip';
  if (bytes.byteLength > 120000000) return 'big';
  const parts = Math.max(1, Math.ceil(bytes.byteLength / LIB_CHUNK));
  for (let i = 0; i < parts; i++) {
    if (onPart) onPart(i + 1, parts);
    for (let attempt = 1; ; attempt++) {
      const fd = new FormData();
      fd.append('file', new File([bytes.slice(i * LIB_CHUNK, (i + 1) * LIB_CHUNK)], 'part' + i + '.pdf', { type: 'application/pdf' }));
      fd.append('subject', book.subject); fd.append('ch', String(book.ch));
      fd.append('part', String(i)); fd.append('parts', String(parts));
      fd.append('size', String(bytes.byteLength)); fd.append('name', name || (chapterName(book) + '.pdf'));
      try { await api('lib', { method: 'POST', body: fd }); break; }
      catch (e) {
        if (attempt >= 5 || /teacher|Unknown chapter|class code/i.test(e.message)) throw e;
        if (onPart) onPart(i + 1, parts, attempt);
        await sleep(2000 * attempt);
      }
    }
  }
  return 'ok';
}
async function downloadLibPdf(key) {
  const item = (LIB.items || []).find((x) => x.key === key);
  const parts = (item && item.parts) || 1;
  const blobs = [];
  for (let i = 0; i < parts; i++) blobs.push(await api('lib/' + key + (parts > 1 ? '?part=' + i : '')));
  return new Blob(blobs, { type: 'application/pdf' });
}
// put every chapter that is on this device but not yet online into the shared library
async function shareLocalChapters() {
  if (!canShare()) { toast('Sign in as the teacher under Homework first.'); return; }
  await loadLib();
  if (!LIB.items) { toast(LIB.err || 'Could not reach the shared library.'); return; }
  const online = new Set(LIB.items.map((x) => x.key));
  const all = await DB.all('notebooks').catch(() => []);
  const todo = all.filter((n) => n.book && !online.has(n.book.subject + '-' + n.book.ch) && (n.pdfIds || []).length);
  let ok = 0; const big = [], bad = [];
  for (let i = 0; i < todo.length; i++) {
    const n = todo[i];
    const label = 'Sharing ' + (i + 1) + ' of ' + todo.length + ': ' + chapterName(n.book);
    toast(label + ' …', null, 600000);
    try {
      const rec = await DB.get('pdfs', n.pdfIds[0]);
      if (!rec) { bad.push(chapterName(n.book) + ' (PDF missing on this device)'); continue; }
      const mb = (rec.bytes.byteLength / 1048576).toFixed(1);
      const r = await shareChapter(n.book, rec.bytes, rec.name, (p, of, retry) =>
        toast(label + ' (' + mb + ' MB), piece ' + p + ' of ' + of + (retry ? ' · slow connection, retrying …' : ' …'), null, 600000));
      if (r === 'ok') ok++; else if (r === 'big') big.push(chapterName(n.book));
    } catch (e) { bad.push(chapterName(n.book) + ' (' + (e && e.message ? e.message : 'upload failed') + ')'); }
  }
  let msg = todo.length ? 'Shared ' + ok + (ok === 1 ? ' chapter' : ' chapters') + ' online.' : 'Every chapter on this device is already shared online.';
  if (big.length) msg += ' Too big to share (over 120 MB): ' + big.join(', ') + '.';
  if (bad.length) msg += ' Could not share: ' + bad.join('; ') + '. Tap Share again to retry; finished chapters are not sent twice.';
  toast(msg, null, 12000);
}
// download one chapter from the shared library and file it on this device
async function fetchChapter(book, quiet) {
  if (!LIB.items) await loadLib();
  const blob = await downloadLibPdf(book.subject + '-' + book.ch);
  const file = new File([blob], chapterName(book) + '.pdf', { type: 'application/pdf' });
  forcedChapter = { subject: book.subject, ch: book.ch };
  if (quiet) { await importManyPdfs([file], true); } else await importPdf(file, 'new');
}
async function fetchAllChapters() {
  await loadLib();
  if (!LIB.items) { toast(LIB.err === 'signin' ? 'Enter the class code under Homework first.' : (LIB.err || 'Could not reach the shared library.')); return; }
  const all = await DB.all('notebooks').catch(() => []);
  const have = new Set(all.filter((n) => n.book).map((n) => n.book.subject + '-' + n.book.ch));
  const todo = LIB.items.filter((x) => !have.has(x.key)).sort((a, b) => (a.subject + a.ch).localeCompare(b.subject + b.ch, undefined, { numeric: true }));
  if (!todo.length) { toast('This device already has every chapter in the shared library.'); return; }
  const files = [];
  for (let i = 0; i < todo.length; i++) {

    try { const blob = await downloadLibPdf(todo[i].key); files.push(new File([blob], todo[i].subject === 'maths' ? 'jemh1' + String(todo[i].ch).padStart(2, '0') + '.pdf' : 'jesc1' + String(todo[i].ch).padStart(2, '0') + '.pdf', { type: 'application/pdf' })); }
    catch (e) { console.warn(e); }
  }
  await importManyPdfs(files, true);
}

/* ---------- export ---------- */
function drawPattern(ctx, bg, hh) {
  // ctx is already scaled to page units
  ctx.fillStyle = bg === 'board' ? BOARD : '#ffffff';
  ctx.fillRect(0, 0, U, hh);
  if (bg === 'ruled') {
    ctx.fillStyle = '#b9d3ee';
    for (let y = 12; y < hh; y += 36) ctx.fillRect(0, y - 1.1, U, 1.1);
    ctx.fillStyle = '#f2a3a3'; ctx.fillRect(89, 0, 2, hh);
  } else if (bg === 'graph') {
    ctx.fillStyle = '#dbe7f3';
    for (let x = 0; x < U; x += 25) ctx.fillRect(x, 0, 1, hh);
    for (let y = 0; y < hh; y += 25) ctx.fillRect(0, y, U, 1);
    ctx.fillStyle = '#9fc0e0';
    for (let x = 0; x < U; x += 125) ctx.fillRect(x, 0, 1.2, hh);
    for (let y = 0; y < hh; y += 125) ctx.fillRect(0, y, U, 1.2);
  } else if (bg === 'dot') {
    ctx.fillStyle = '#a9b4c2';
    for (let y = 15; y < hh; y += 30) for (let x = 15; x < U; x += 30) { ctx.beginPath(); ctx.arc(x, y, 1.8, 0, Math.PI * 2); ctx.fill(); }
  }
}
async function renderPageImage(p, W) {
  const H = Math.round(W * p.h / U), k = W / U;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  if (p.bg === 'pdf') {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    try {
      const pdf = await getPdf(p.pdfId);
      const pg = await pdf.getPage(p.pdfPage);
      const vp1 = pg.getViewport({ scale: 1 });
      await pg.render({ canvasContext: ctx, viewport: pg.getViewport({ scale: W / vp1.width }) }).promise;
    } catch (e) { console.warn(e); }
  } else {
    ctx.setTransform(k, 0, 0, k, 0, 0);
    drawPattern(ctx, p.bg, p.h);
  }
  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawInk(ctx, p.strokes);
  return cv;
}
let exporting = false;
async function exportPdf() {
  if (exporting || !nb) return;
  if (!window.jspdf) { toast('The PDF writer did not load. Check the internet connection and reload the page.'); return; }
  exporting = true;
  try {
    await saveNow();
    const blob = await buildNotebookPdf(1600, 0.88);
    const name = (nb.name.replace(/[\\/:*?"<>|]+/g, ' ').trim() || 'notes') + '.pdf';
    const file = new File([blob], name, { type: 'application/pdf' });
    toast('PDF ready: ' + nb.pages.length + (nb.pages.length === 1 ? ' page.' : ' pages.'), { label: 'Share or save', fn: () => deliver(file, blob, name), ms: 30000 });
  } catch (e) {
    console.warn(e);
    toast('Could not make the PDF: ' + (e && e.message ? e.message : 'unknown error'));
  } finally { exporting = false; }
}
async function buildNotebookPdf(width, quality) {
  const { jsPDF } = window.jspdf;
  let doc = null;
  for (let i = 0; i < nb.pages.length; i++) {
    toast('Preparing page ' + (i + 1) + ' of ' + nb.pages.length + ' …', null, 60000);
    const p = nb.pages[i];
    const cv = await renderPageImage(p, width);
    const img = cv.toDataURL('image/jpeg', quality);
    cv.width = 0; cv.height = 0;
    const wpt = 595.28, hpt = wpt * p.h / U, orient = hpt >= wpt ? 'portrait' : 'landscape';
    if (!doc) doc = new jsPDF({ unit: 'pt', format: [wpt, hpt], orientation: orient, compress: true });
    else doc.addPage([wpt, hpt], orient);
    doc.addImage(img, 'JPEG', 0, 0, wpt, hpt);
    for (const n of (p.notes || []).filter((q) => q.strokes.length)) {
      const nc = await renderPageImage(n, width);
      const nimg = nc.toDataURL('image/jpeg', quality);
      nc.width = 0; nc.height = 0;
      const nh = wpt * n.h / U;
      doc.addPage([wpt, nh], nh >= wpt ? 'portrait' : 'landscape');
      doc.addImage(nimg, 'JPEG', 0, 0, wpt, nh);
    }
  }
  doc.setProperties({ title: nb.name, creator: 'Study Board' });
  return doc.output('blob');
}
async function deliver(file, blob, name) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function showDoc(blob, title, markItem) {
  const pagesEl = h('div', { class: 'docpages' });

  const head = h('div', { class: 'dochead' }, h('strong', null, title));

  if (!pdfReady()) { pagesEl.append(h('p', { class: 'empty' }, 'The PDF reader did not load. Reload the page and try again.')); return; }
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
  const n = Math.min(pdf.numPages, 40);

  for (let i = 1; i <= n && box.isConnected; i++) {
    const page = await pdf.getPage(i);
    const v1 = page.getViewport({ scale: 1 });
    const scale = (cssW * Math.min(2, window.devicePixelRatio || 1)) / v1.width;

  else api('photo/' + m.id).then((b) => { const u = URL.createObjectURL(b); picUrls.set(m.id, u); show(u); }).catch(() => { img.replaceWith(h('span', { class: 'meta' }, 'Picture could not load. Tap Chat to retry.')); });
  const teacher = myRole() === 'teacher';
  const markIt = async () => {
    hwSay('Opening the picture for marking …');
    try {
      const blob = await api('photo/' + m.id);
      const file = await imagesToPdf([new File([blob], 'picture.jpg', { type: blob.type })]);
      await importPdf(new File([file], 'Homework ' + new Date(m.at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ' (picture).pdf', { type: 'application/pdf' }), 'new');
      HW.msg = '';
      closeHw();
      nb.fromChat = true; dirty();
      toast('Mark it with the pen. To send it back: ⋯ menu, then Send page 1 to Tanish in Chat.', null, 9000);
    } catch (e) { hwSay(e.message, true); }
  };
  // teacher: tapping the picture opens it as a page to write on; student: tapping shows it full size
  img.title = teacher ? 'Tap to mark this picture' : 'Tap to see full size';
  img.addEventListener('click', () => { if (teacher) markIt(); else if (img.src) showBig(img.src); });
  wrap.append(img);
  if (teacher) {
    wrap.append(h('div', { class: 'hwacts' },
      h('button', { class: 'hwbtn', type: 'button', onclick: markIt }, '✏️ Mark this picture'),
      h('button', { class: 'tb', type: 'button', onclick: () => { if (img.src) showBig(img.src); } }, 'View full size')));
  }
  return wrap;
}
// full-size view inside Study Board (a new window would open outside the app on iPad)
function showBig(url) {
  const close = () => box.remove();
  const box = h('div', { class: 'bigpic', role: 'dialog', 'aria-label': 'Picture', onclick: close },
    h('img', { src: url, alt: 'Picture' }),
    h('button', { class: 'hwbtn', type: 'button', onclick: close }, 'Close'));
  document.body.append(box);
}
// send marked pages (writing included) into the chat as pictures
async function sendPagesToChat(idxs) {
  if (!HW.code) { toast('Sign in under Homework first.'); return; }
  const list = idxs.slice(0, 15);
  try {
    await saveNow();
    for (let i = 0; i < list.length; i++) {
      toast('Sending page ' + (list[i] + 1) + (list.length > 1 ? ' (' + (i + 1) + ' of ' + list.length + ')' : '') + ' …', null, 120000);
      const cv = await renderPageImage(nb.pages[list[i]], 1600);
      const blob = await new Promise((r) => cv.toBlob(r, 'image/jpeg', 0.85));
      cv.width = 0; cv.height = 0;
      const fd = new FormData();
      fd.append('file', new File([blob], 'page.jpg', { type: 'image/jpeg' }));
      if (i === 0) fd.append('text', (HW.role === 'teacher' ? 'Corrected: ' : '') + nb.name + (list.length > 1 ? ' (' + list.length + ' pages)' : ''));
      const r = await api('photo', { method: 'POST', body: fd });
      picUrls.set(r.msg.id, URL.createObjectURL(blob));
      HW.msgs.push(r.msg);
    }
    markSeen();
    toast('Sent to ' + (HW.role === 'teacher' ? 'Tanish' : 'Papa') + ' in Chat.', { label: 'Open chat', fn: () => openHw(null, 'chat') });
  } catch (e) { toast('Could not send: ' + (e && e.message ? e.message : 'try again')); }
}
async function sendPictures(files, text) {
  files = files.filter((f) => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
  if (!files.length) return;
  for (let i = 0; i < files.length; i++) {
    hwSay('Sending picture ' + (i + 1) + ' of ' + files.length + ' …');
    try {
      const img = await loadImage(files[i]);
      const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      const c = cv.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height); c.drawImage(img, 0, 0, cv.width, cv.height);
      const blob = await new Promise((r) => cv.toBlob(r, 'image/jpeg', 0.85));
      cv.width = 0;
      const fd = new FormData();
      fd.append('file', new File([blob], 'picture.jpg', { type: 'image/jpeg' }));
      if (i === 0 && text) fd.append('text', text);
      const r = await api('photo', { method: 'POST', body: fd });
      picUrls.set(r.msg.id, URL.createObjectURL(blob));
      HW.msgs.push(r.msg);
    } catch (e) { hwSay(e.message, true); return; }
  }
  const box = hwEl.querySelector('#chatText'); if (box && text) box.value = '';
  HW.draft = ''; HW.msg = ''; markSeen(); renderHw();
}

/* voice messages */
const voiceUrls = new Map();
function voicePlayer(m) {
  const wrap = h('div', { class: 'voice' }, h('span', { class: 'meta' }, 'Voice message' + (m.audio.dur ? ' · ' + fmtDur(m.audio.dur) : '')));
  const put = (url) => {
    const a = h('audio', { controls: true, preload: 'metadata', src: url });
    a.addEventListener('ended', () => { if (HW.pendingRender && !chatBusy()) { HW.pendingRender = false; renderHw(); } });
    wrap.append(a);
  };
  if (voiceUrls.has(m.id)) put(voiceUrls.get(m.id));
  else {
    const b = h('button', { class: 'tb', type: 'button' }, 'Load');
    b.addEventListener('click', async () => {
      b.disabled = true; b.textContent = 'Loading …';
      try { const blob = await api('voice/' + m.id); const url = URL.createObjectURL(blob); voiceUrls.set(m.id, url); b.remove(); put(url); const a = wrap.querySelector('audio'); if (a) a.play().catch(() => {}); }
      catch (e) { b.disabled = false; b.textContent = 'Load'; hwSay(e.message, true); }
    });
    wrap.append(b);
  }
  return wrap;
}
const fmtDur = (s) => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
function pickAudioType() {
  if (!window.MediaRecorder) return null;
  for (const t of ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus']) { try { if (MediaRecorder.isTypeSupported(t)) return t; } catch (e) {} }
  return '';
}
async function startRecording() {
  if (HW.rec) return;
  const type = pickAudioType();
  if (type === null || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { hwSay('This browser cannot record voice. Use Chrome on the laptop or Safari on the iPad.', true); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { hwSay('The microphone is blocked. Allow the microphone for this site in the browser settings, then try again.', true); return; }
  const chunks = [];
  const mr = type ? new MediaRecorder(stream, { mimeType: type, audioBitsPerSecond: 32000 }) : new MediaRecorder(stream);
  mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  HW.rec = { mr, stream, chunks, start: Date.now(), cancel: false, tick: null };
  mr.onstop = async () => {
    const r = HW.rec; HW.rec = null;
    clearInterval(r.tick);
    r.stream.getTracks().forEach((t) => t.stop());
    const dur = (Date.now() - r.start) / 1000;
    if (r.cancel || dur < 0.8) { renderHw(); return; }
    const blob = new Blob(r.chunks, { type: (mr.mimeType || type || 'audio/webm').split(';')[0] });
    renderHw();
    hwSay('Sending voice message …');
    try {
      const fd = new FormData();
      fd.append('file', new File([blob], 'voice', { type: blob.type }));
      fd.append('dur', String(Math.round(dur)));
      const res = await api('voice', { method: 'POST', body: fd });
      voiceUrls.set(res.msg.id, URL.createObjectURL(blob));
      HW.msgs.push(res.msg); markSeen(); HW.msg = ''; renderHw();
    } catch (e) { hwSay(e.message, true); }
  };
  mr.start(1000);
  HW.rec.tick = setInterval(() => {
    const el = hwEl.querySelector('.rectime');
    const secs = (Date.now() - (HW.rec ? HW.rec.start : Date.now())) / 1000;
    if (el) el.textContent = fmtDur(secs);
    if (secs >= 180 && HW.rec) { HW.rec.mr.stop(); }
  }, 250);
  renderHw();
}
function recordingBar() {
  const stop = h('button', { class: 'hwbtn', type: 'button' }, 'Stop and send');
  stop.addEventListener('click', () => { if (HW.rec) HW.rec.mr.stop(); });
  const cancel = h('button', { class: 'tb', type: 'button' }, 'Cancel');
  cancel.addEventListener('click', () => { if (HW.rec) { HW.rec.cancel = true; HW.rec.mr.stop(); } });
  return h('div', { class: 'recbar' }, h('span', { class: 'recdot' }), h('span', null, 'Recording '), h('b', { class: 'rectime' }, '0:00'), h('span', { class: 'meta' }, '(up to 3 minutes)'), stop, cancel);
}
async function loadSettings() {
  try { const r = await api('settings'); HW.meetUrl = (r.settings && r.settings.meetUrl) || ''; } catch (e) {}
  // the teacher's saved Meet link is shared so Tanish can join from the chat
  if (HW.role === 'teacher' && prefs.meetUrl && prefs.meetUrl !== HW.meetUrl) {
    try { const r = await api('settings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ meetUrl: prefs.meetUrl }) }); HW.meetUrl = r.settings.meetUrl || ''; } catch (e) {}
  }
}

// check for new messages every 2 minutes while the app is open, so the ☰ button can show a dot
setInterval(() => { if (HW.code && document.visibilityState === 'visible' && (hwEl.hidden || HW.view !== 'chat')) pollChat(); }, 120000);
setTimeout(() => { if (HW.code) pollChat(); }, 3000);

/* ---------- start ---------- */
async function init() {
  if (pdfReady()) pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER_SRC;
  try { await DB.open(); }
  catch (e) { DB.useMemory(); setTimeout(() => toast('This browser is not letting Study Board save. Work will be lost when the page closes.', null, 8000), 400); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  let n = null;
  if (prefs.lastNb) n = await DB.get('notebooks', prefs.lastNb).catch(() => null);
  if (!n) {
    const all = await DB.all('notebooks').catch(() => []);
    all.sort((a, b) => b.updated - a.updated);
    n = all[0] || null;
  }
  if (!n) { n = seedNotebook(); await DB.put('notebooks', n).catch(() => {}); }
  renderToolbar();
  setNotebook(n, true);
  syncPush();
  if (location.hash === '#homework') openHw();
  if (location.hash === '#chat') openHw(null, 'chat');
  if (location.hash === '#tutor') openHw(null, 'tutor');
  window.addEventListener('hashchange', () => { if (location.hash === '#homework') openHw(); if (location.hash === '#chat') openHw(null, 'chat'); });
  if (!prefs.seenTip) {
    prefs.seenTip = true; savePrefs();
    setTimeout(() => toast('Write with Apple Pencil. Scroll with one finger, pinch with two to zoom.', null, 7000), 300);
  }
}
init();
})();
